    { id: "todo",    name: "やること",     color: "teal",   monthly: false },
    { id: "boss",    name: "院長から",     color: "rose",   monthly: false },
    { id: "monthly", name: "毎月やること", color: "indigo", monthly: true  },
    { id: "buy",     name: "買うもの",     color: "olive",  monthly: false }
  ];
  // Folders that existed before folders were editable, kept so old memos land somewhere.
  var LEGACY_NAMES = { share: { name: "申し送り", color: "plum" } };

  var LS_STATE = "stella-memo/state/v1";
  var LS_PREFS = "stella-memo/prefs/v1";
  var SS_DRAFT = "stella-memo/draft/v1";
  var TOMBSTONE_MS = 21 * 24 * 60 * 60 * 1000;
  var TRASH_ICON = '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path>';
  var TICK_ICON = '<path d="M20 6L9 17l-5-5"></path>';

  var state = { updatedAt: 0, folders: [], items: [], deleted: [], deletedFolders: [] };
  var current = "todo";
  var filter = "all";
  var showDone = false;
  var readOnly = false;
  var canSave = true;
  var saving = false;
  var dirty = false;
  var saveTimer = null;
  var api = null;
  var apiPromise = null;

  /* ---------- storage helpers (never throw) ---------- */
  function lsGet(key) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function ssGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }
  function ssSet(key, val) {
    try { if (val) sessionStorage.setItem(key, val); else sessionStorage.removeItem(key); } catch (e) {}
  }

  /* ---------- state shape ---------- */
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* Accepts both the original flat shape (items carrying `cat`) and the
     folder shape, so a phone holding an old copy still merges cleanly. */
  function normalize(raw) {
    var s = { updatedAt: 0, folders: [], items: [], deleted: [], deletedFolders: [] };
    if (!raw || typeof raw !== "object") return s;
    s.updatedAt = Number(raw.updatedAt) || 0;

    var seen = {};
    if (Array.isArray(raw.folders)) {
      raw.folders.forEach(function (f) {
        if (!f || !f.id || seen[f.id]) return;
        seen[f.id] = true;
        s.folders.push({
          id: String(f.id),
          name: typeof f.name === "string" && f.name.trim() ? f.name : "フォルダ",
          color: COLOR_SET[f.color] ? f.color : "teal",
          monthly: !!f.monthly,
          order: Number(f.order) || 0,
          updatedAt: Number(f.updatedAt) || 0
        });
      });
    }

    if (Array.isArray(raw.items)) {
      raw.items.forEach(function (it) {
        if (!it || typeof it.text !== "string" || !it.id) return;
        s.items.push({
          id: String(it.id),
          text: it.text,
          folder: String(it.folder || it.cat || "todo"),
          done: !!it.done,
          createdAt: Number(it.createdAt) || 0,
          updatedAt: Number(it.updatedAt) || Number(it.createdAt) || 0,
          doneAt: Number(it.doneAt) || 0
        });
      });
    }

    [["deleted", "deleted"], ["deletedFolders", "deletedFolders"]].forEach(function (pair) {
      var src = raw[pair[0]];
      if (!Array.isArray(src)) return;
      src.forEach(function (d) {
        if (d && d.id) s[pair[1]].push({ id: String(d.id), at: Number(d.at) || 0 });
      });
    });

    return s;
  }

  /* Make sure every folder an item points at exists, and that there is at
     least one folder to point at. */
  function ensureFolders(s) {
    var have = {};
    s.folders.forEach(function (f) { have[f.id] = true; });
    var gone = {};
    s.deletedFolders.forEach(function (d) { gone[d.id] = true; });

    if (!s.folders.length) {
      DEFAULT_FOLDERS.forEach(function (d, i) {
        if (gone[d.id]) return;
        s.folders.push({ id: d.id, name: d.name, color: d.color, monthly: d.monthly, order: i, updatedAt: 0 });
        have[d.id] = true;
      });
    }

    s.items.forEach(function (it) {
      if (have[it.folder]) return;
      var legacy = LEGACY_NAMES[it.folder];
      var preset = null;
      DEFAULT_FOLDERS.forEach(function (d) { if (d.id === it.folder) preset = d; });
      if ((legacy || preset) && !gone[it.folder]) {
        s.folders.push({
          id: it.folder,
          name: (preset || legacy).name,
          color: (preset || legacy).color,
          monthly: preset ? preset.monthly : false,
          order: s.folders.length,
          updatedAt: 0
        });
        have[it.folder] = true;
      } else {
        it.folder = s.folders.length ? s.folders[0].id : "todo";
      }
    });

    if (!s.folders.length) {
      s.folders.push({ id: "todo", name: "やること", color: "teal", monthly: false, order: 0, updatedAt: 0 });
      s.items.forEach(function (it) { it.folder = "todo"; });
    }

    s.folders.sort(function (a, b) { return (a.order - b.order) || (a.id < b.id ? -1 : 1); });
    return s;
  }

  /* Item-level merge, so two phones writing at once never lose a memo. */
  function merge(a, b) {
    a = normalize(a); b = normalize(b);
    var out = { updatedAt: Math.max(a.updatedAt, b.updatedAt), folders: [], items: [], deleted: [], deletedFolders: [] };
    var cutoff = Date.now() - TOMBSTONE_MS;

    function newest(listA, listB) {
      var byId = {};
      listA.concat(listB).forEach(function (x) {
        var prev = byId[x.id];
        if (!prev || x.updatedAt > prev.updatedAt) byId[x.id] = x;
      });
      return byId;
    }
    function tombs(listA, listB) {
      var t = {};
      listA.concat(listB).forEach(function (d) {
        if (!t[d.id] || d.at > t[d.id].at) t[d.id] = d;
      });
      return t;
    }
    function survivors(byId, t) {
      var kept = [];
      Object.keys(byId).forEach(function (id) {
        var x = byId[id];
        if (t[id] && t[id].at >= x.updatedAt) return;
        kept.push(x);
      });
      return kept;
    }
    function living(t) {
      var kept = [];
      Object.keys(t).forEach(function (id) { if (t[id].at >= cutoff) kept.push(t[id]); });
      return kept;
    }

    var itemTombs = tombs(a.deleted, b.deleted);
    var folderTombs = tombs(a.deletedFolders, b.deletedFolders);

    out.items = survivors(newest(a.items, b.items), itemTombs)
      .sort(function (x, y) { return x.createdAt - y.createdAt; });
    out.folders = survivors(newest(a.folders, b.folders), folderTombs);
    out.deleted = living(itemTombs);
    out.deletedFolders = living(folderTombs);

    return ensureFolders(out);
  }

  function fingerprint(s) {
    return s.items.map(function (it) {
      return [it.id, it.text, it.folder, it.done ? 1 : 0, it.doneAt].join("");
    }).join("") + "||" + s.folders.map(function (f) {
      return [f.id, f.name, f.color, f.monthly ? 1 : 0].join("");
    }).join("");
  }

  /* ---------- folders ---------- */
  function folderOf(it) {
    var f = null;
    state.folders.forEach(function (x) { if (x.id === it.folder) f = x; });
    return f || state.folders[0];
  }

  function monthKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + (d.getMonth() + 1);
  }

  /* A memo in a monthly folder counts as done only for the month it was
     ticked in, so every folder resets itself when the month turns over —
     no scheduled job, and it works the same on every device. */
  function isDone(it) {
    if (!it.done) return false;
    var f = folderOf(it);
    if (f && f.monthly) return monthKey(it.doneAt || it.updatedAt) === monthKey(Date.now());
    return true;
  }

  function nextColor() {
    var used = {};
    state.folders.forEach(function (f) { used[f.color] = true; });
    var pick = null;
    COLORS.forEach(function (c) { if (!pick && !used[c]) pick = c; });
    return pick || COLORS[state.folders.length % COLORS.length];
  }

  /* ---------- saving ---------- */
  function getApi() {
    if (apiPromise) return apiPromise;
    if (!window.claude || typeof window.claude.use !== "function") {
      apiPromise = Promise.resolve(null);
      return apiPromise;
    }
    apiPromise = window.claude.use("artifact").then(function (ns) {
      api = ns || null;
      return api;
    }, function () { return null; });
    return apiPromise;
  }

  function setStatus(kind, text) {
    document.getElementById("status").setAttribute("data-state", kind);
    document.getElementById("status-text").textContent = text;
  }

  function scheduleSave() {
    dirty = true;
    lsSet(LS_STATE, state);
    if (!canSave) { setStatus("local", "この端末のみ"); return; }
    setStatus("saving", "保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1400);
  }

  function stateJson() {
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  /* Saving rewrites this page's own stored source with the new state block
     and publishes it as the next version. */
  function save() {
    if (saving || !dirty) return;
    getApi().then(function (ns) {
      if (!ns) {
        canSave = false;
        setStatus("local", "この端末のみ");
        return;
      }
      saving = true;
      dirty = false;
      state.updatedAt = Date.now();
      lsSet(LS_STATE, state);

      var OPEN = "<" + 'script id="app-state" type="application/json">';
      var CLOSE = "<" + "/script>";
      fetch(location.pathname, { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (src) {
          var i = src.indexOf(OPEN);
          var j = i < 0 ? -1 : src.indexOf(CLOSE, i);
          if (i < 0 || j < 0 || !/^\s*<!doctype/i.test(src)) {
            throw { code: "page_unreadable", message: "保存先が見つかりません" };
          }
          return ns.publish(src.slice(0, i + OPEN.length) + stateJson() + src.slice(j));
        })
        .then(function () {
          saving = false;
          setStatus("saved", "保存済み");
          if (dirty) scheduleSave();
        }, function (err) {
          saving = false;
          dirty = true;
          handleSaveError(err);
        });
    });
  }

  function handleSaveError(err) {
    var code = (err && err.code) || "upstream_error";
    if (code === "conflict") {
      // Someone else published first; every view is already reloading to
      // theirs. This device keeps its copy and merges on the way back in.
      setStatus("saving", "更新中…");
      return;
    }
    if (code === "not_writer" || code === "not_granted" ||
        code === "consent_required" || code === "not_declared") {
      canSave = false;
      readOnly = true;
      setStatus("local", "閲覧のみ");
      render();
      return;
    }
    if (code === "rate_limited") {
      setStatus("saving", "保存中…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 5000);
      return;
    }
    setStatus("error", "保存できません");
    showRetryBanner();
  }

  function showRetryBanner() {
    var slot = document.getElementById("banner-slot");
    if (slot.querySelector(".banner")) return;
    var b = document.createElement("div");
    b.className = "banner";
    var msg = document.createElement("span");
    msg.textContent = "保存できませんでした。内容はこの端末に残っています。";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "再試行";
    btn.addEventListener("click", function () {
      slot.innerHTML = "";
      setStatus("saving", "保存中…");
      save();
    });
    b.appendChild(msg);
    b.appendChild(btn);
    slot.appendChild(b);
  }

  /* ---------- actions ---------- */
  function addItem(text) {
    var now = Date.now();
    state.items.push({
      id: newId(),
      text: text,
      folder: current,
      done: false,
      createdAt: now,
      updatedAt: now,
      doneAt: 0
    });
    render();
    scheduleSave();
  }

  function findItem(id) {
    var found = null;
    state.items.forEach(function (it) { if (it.id === id) found = it; });
    return found;
  }

  function toggleItem(id) {
    var it = findItem(id);
    if (!it) return;
    var wasDone = isDone(it);
    it.done = !wasDone;
    it.doneAt = it.done ? Date.now() : 0;
    it.updatedAt = Date.now();
    render();
    scheduleSave();
  }

  function deleteItem(id) {
    var keep = [];
    var hit = false;
    state.items.forEach(function (it) {
      if (it.id === id) hit = true; else keep.push(it);
    });
    if (!hit) return;
    state.items = keep;
    state.deleted.push({ id: id, at: Date.now() });
    render();
    scheduleSave();
  }

  function clearDone() {
    var now = Date.now();
    var keep = [];
    state.items.forEach(function (it) {
      var f = folderOf(it);
      if (isDone(it) && !(f && f.monthly)) state.deleted.push({ id: it.id, at: now });
      else keep.push(it);
    });
    state.items = keep;
    render();
    scheduleSave();
  }

  /* ---------- rendering ---------- */
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var now = new Date();
    var hm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (d.toDateString() === now.toDateString()) return hm;
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }

  function icon(path, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) +
           '" stroke-linecap="round" stroke-linejoin="round">' + path + "</svg>";
  }

  function renderFilters() {
    var box = document.getElementById("filters");
    box.innerHTML = "";

    var all = document.createElement("button");
    all.type = "button";
    all.className = "fchip";
    all.setAttribute("aria-pressed", filter === "all" ? "true" : "false");
    all.innerHTML = "<span>すべて</span>" + '<span class="n">' +
      state.items.filter(function (it) { return !isDone(it); }).length + "</span>";
    all.addEventListener("click", function () { filter = "all"; savePrefs(); render(); });
    box.appendChild(all);

    state.folders.forEach(function (f) {
      var n = state.items.filter(function (it) {
        return it.folder === f.id && !isDone(it);
      }).length;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "fchip c-" + f.color;
      b.setAttribute("aria-pressed", filter === f.id ? "true" : "false");
      var sw = document.createElement("span");
      sw.className = "swat";
      var nm = document.createElement("span");
      nm.textContent = f.name;
      var cnt = document.createElement("span");
      cnt.className = "n";
      cnt.textContent = n;
      b.appendChild(sw);
      b.appendChild(nm);
      b.appendChild(cnt);
      b.addEventListener("click", function () { filter = f.id; savePrefs(); render(); });
      box.appendChild(b);
    });
  }

  function itemEl(it) {
    var f = folderOf(it);
    var done = isDone(it);
    var row = document.createElement("article");
    row.className = "item c-" + (f ? f.color : "teal") + (done ? " is-done" : "");

    var check = document.createElement("button");
    check.type = "button";
    check.className = "check";
    check.setAttribute("aria-label", done ? "未完了に戻す" : "完了にする");
    check.innerHTML = '<span class="box">' + icon(TICK_ICON, 3.2) + "</span>";

    var body = document.createElement("button");
    body.type = "button";
    body.className = "body";
    var p = document.createElement("p");
    p.className = "text";
    p.textContent = it.text;
    var meta = document.createElement("div");
    meta.className = "meta";
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = (f && f.monthly ? "↻ " : "") + (f ? f.name : "");
    var when = document.createElement("span");
    when.textContent = fmtTime(done ? (it.doneAt || it.createdAt) : it.createdAt);
    meta.appendChild(tag);
    meta.appendChild(when);
    body.appendChild(p);
    body.appendChild(meta);

    row.appendChild(check);
    row.appendChild(body);

    if (readOnly) {
      check.disabled = true;
      body.disabled = true;
      return row;
    }

    check.addEventListener("click", function () { toggleItem(it.id); });
    body.addEventListener("click", function () { toggleItem(it.id); });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.setAttribute("aria-label", "削除");
    del.innerHTML = icon(TRASH_ICON, 1.8);
    var armed = null;
    del.addEventListener("click", function () {
      if (del.classList.contains("confirm")) {
        clearTimeout(armed);
        deleteItem(it.id);
        return;
      }
      del.classList.add("confirm");
      del.textContent = "削除?";
      armed = setTimeout(function () {
        del.classList.remove("confirm");
        del.innerHTML = icon(TRASH_ICON, 1.8);
      }, 3000);
    });
    row.appendChild(del);
    return row;
  }

  function render() {
    if (filter !== "all") {
      var stillThere = false;
      state.folders.forEach(function (f) { if (f.id === filter) stillThere = true; });
      if (!stillThere) filter = "all";
    }
    renderFilters();
    renderCats();

    var list = document.getElementById("list");
    list.innerHTML = "";

    var inView = state.items.filter(function (it) {
      return filter === "all" || it.folder === filter;
    });
    var open = inView.filter(function (it) { return !isDone(it); });
    var done = inView.filter(isDone).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    if (open.length) {
      open.forEach(function (it) { list.appendChild(itemEl(it)); });
    } else {
      var viewFolder = null;
      state.folders.forEach(function (f) { if (f.id === filter) viewFolder = f; });
      var e = document.createElement("div");
      e.className = "empty";
      var h = document.createElement("strong");
      var sub = "";
      if (!state.items.length) {
        h.textContent = "メモはまだありません";
        sub = "下の入力欄から、思いついたその場で。";
      } else if (viewFolder && viewFolder.monthly && done.length) {
        h.textContent = "今月分はおわりました";
        sub = "来月になると自動でチェックが戻ります。";
      } else if (done.length) {
        h.textContent = "残りはありません";
        sub = "ここのぶんは全部おわりました。";
      } else {
        h.textContent = "このフォルダは空です";
        sub = "上のタブで切り替えられます。";
      }
      e.appendChild(h);
      e.appendChild(document.createTextNode(sub));
      list.appendChild(e);
    }

    if (done.length) {
      var clearable = done.filter(function (it) {
        var f = folderOf(it);
        return !(f && f.monthly);
      }).length;

      var dh = document.createElement("div");
      dh.className = "done-head";
      var t = document.createElement("button");
      t.type = "button";
      t.className = "done-toggle";
      t.setAttribute("aria-expanded", showDone ? "true" : "false");
      t.innerHTML = icon('<path d="M9 5l7 7-7 7"></path>', 2.4) +
                    "<span>完了 " + done.length + "件</span>";
      t.addEventListener("click", function () { showDone = !showDone; savePrefs(); render(); });
      dh.appendChild(t);

      if (showDone && !readOnly && clearable) {
        var c = document.createElement("button");
        c.type = "button";
        c.className = "clear";
        c.textContent = "完了を消す";
        var armed = null;
        c.addEventListener("click", function () {
          if (c.classList.contains("confirm")) { clearTimeout(armed); clearDone(); return; }
          c.classList.add("confirm");
          c.textContent = "もう一度で消去";
          armed = setTimeout(function () {
            c.classList.remove("confirm");
            c.textContent = "完了を消す";
          }, 3000);
        });
        dh.appendChild(c);
      }
      list.appendChild(dh);

      if (showDone) done.forEach(function (it) { list.appendChild(itemEl(it)); });
    }

    document.getElementById("compose").style.display = readOnly ? "none" : "";
    document.getElementById("hint").textContent = readOnly
      ? ""
      : (matchMedia("(pointer: fine)").matches
          ? "Enter で追加 / Shift+Enter で改行"
          : "タップで完了、もう一度タップで戻せます");
  }

  /* ---------- compose ---------- */
  var input = document.getElementById("input");
  var send = document.getElementById("send");

  function renderCats() {
    var exists = false;
    state.folders.forEach(function (f) { if (f.id === current) exists = true; });
    if (!exists && state.folders.length) current = state.folders[0].id;

    var box = document.getElementById("cats");
    box.innerHTML = "";
    state.folders.forEach(function (f) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cchip c-" + f.color;
      b.textContent = f.name;
      b.setAttribute("aria-pressed", current === f.id ? "true" : "false");
      b.addEventListener("click", function () {
        current = f.id;
        savePrefs();
        renderCats();
        input.focus();
      });
      box.appendChild(b);
    });
  }

  function syncEntry() {
    input.style.height = "44px";
    input.style.height = Math.min(input.scrollHeight + 2, 148) + "px";
    send.disabled = !input.value.trim();
    ssSet(SS_DRAFT, input.value);
  }

  function submit() {
    var text = input.value.trim();
    if (!text) return;
    addItem(text);
    input.value = "";
    ssSet(SS_DRAFT, "");
    syncEntry();
    input.focus();
  }

  input.addEventListener("input", syncEntry);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing &&
        matchMedia("(pointer: fine)").matches) {
      e.preventDefault();
      submit();
    }
  });
  send.addEventListener("click", submit);

  /* ---------- folder sheet ---------- */
  function openSheet() {
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    scrim.appendChild(sheet);

    var grip = document.createElement("div");
    grip.className = "grip";
    sheet.appendChild(grip);

    var head = document.createElement("div");
    head.className = "sheet-head";
    var h2 = document.createElement("h2");
    h2.textContent = "フォルダ";
    var doneBtn = document.createElement("button");
    doneBtn.type = "button";
    doneBtn.className = "sheet-done";
    doneBtn.textContent = "完了";
    doneBtn.addEventListener("click", close);
    head.appendChild(h2);
    head.appendChild(doneBtn);
    sheet.appendChild(head);

    var note = document.createElement("p");
    note.className = "sheet-note";
    note.textContent = "「毎月リセット」を付けたフォルダは、月が変わるとチェックが自動で外れます。毎月やることの置き場にどうぞ。";
    sheet.appendChild(note);

    var rows = document.createElement("div");
    rows.className = "frows";
    sheet.appendChild(rows);
    state.folders.forEach(function (f) { rows.appendChild(folderRow(f, rows)); });

    var add = document.createElement("button");
    add.type = "button";
    add.className = "fadd";
    add.textContent = "＋ フォルダを追加";
    add.addEventListener("click", function () {
      var maxOrder = 0;
      state.folders.forEach(function (f) { maxOrder = Math.max(maxOrder, f.order); });
      var f = {
        id: newId(),
        name: "新しいフォルダ",
        color: nextColor(),
        monthly: false,
        order: maxOrder + 1,
        updatedAt: Date.now()
      };
      state.folders.push(f);
      var row = folderRow(f, rows);
      rows.appendChild(row);
      render();
      scheduleSave();
      var nameInput = row.querySelector(".fname");
      nameInput.focus();
      nameInput.select();
    });
    sheet.appendChild(add);

    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    document.addEventListener("keydown", onKey);
    document.querySelector(".app").appendChild(scrim);

    function onKey(e) { if (e.key === "Escape") close(); }
    function close() {
      document.removeEventListener("keydown", onKey);
      scrim.remove();
      render();
    }
  }

  function folderRow(f, rows) {
    var row = document.createElement("div");
    row.className = "frow c-" + f.color;

    var top = document.createElement("div");
    top.className = "frow-top";
    var name = document.createElement("input");
    name.className = "fname";
    name.type = "text";
    name.value = f.name;
    name.setAttribute("aria-label", "フォルダ名");
    name.addEventListener("input", function () {
      f.name = name.value.trim() ? name.value : "フォルダ";
      f.updatedAt = Date.now();
      renderCats();
      renderFilters();
      scheduleSave();
    });
    top.appendChild(name);
    row.appendChild(top);

    var sws = document.createElement("div");
    sws.className = "swatches";
    COLORS.forEach(function (c) {
      var s = document.createElement("button");
      s.type = "button";
      s.className = "sw c-" + c;
      s.setAttribute("aria-label", "色を変える");
      s.setAttribute("aria-pressed", f.color === c ? "true" : "false");
      s.addEventListener("click", function () {
        f.color = c;
        f.updatedAt = Date.now();
        row.className = "frow c-" + c;
        sws.querySelectorAll(".sw").forEach(function (el) { el.setAttribute("aria-pressed", "false"); });
        s.setAttribute("aria-pressed", "true");
        render();
        scheduleSave();
      });
      sws.appendChild(s);
    });
    row.appendChild(sws);

    var bot = document.createElement("div");
    bot.className = "frow-bot";
    var tog = document.createElement("button");
    tog.type = "button";
    tog.className = "toggle";
    tog.setAttribute("aria-pressed", f.monthly ? "true" : "false");
    tog.innerHTML = '<span class="mark">' + icon(TICK_ICON, 3.4) + "</span><span>毎月リセット</span>";
    tog.addEventListener("click", function () {
      f.monthly = !f.monthly;
      f.updatedAt = Date.now();
      tog.setAttribute("aria-pressed", f.monthly ? "true" : "false");
      render();
      scheduleSave();
    });
    bot.appendChild(tog);

    var del = document.createElement("button");
    del.type = "button";
    del.className = "fdel";
    del.textContent = "削除";
    var armed = null;
    del.addEventListener("click", function () {
      if (state.folders.length < 2) return;
      var count = state.items.filter(function (it) { return it.folder === f.id; }).length;
      var target = null;
      state.folders.forEach(function (x) { if (!target && x.id !== f.id) target = x; });
      if (!del.classList.contains("confirm")) {
        del.classList.add("confirm");
        del.textContent = count
          ? "メモ" + count + "件を「" + target.name + "」へ移して削除"
          : "もう一度で削除";
        armed = setTimeout(function () {
          del.classList.remove("confirm");
          del.textContent = "削除";
        }, 4000);
        return;
      }
      clearTimeout(armed);
      var now = Date.now();
      state.items.forEach(function (it) {
        if (it.folder === f.id) { it.folder = target.id; it.updatedAt = now; }
      });
      state.folders = state.folders.filter(function (x) { return x.id !== f.id; });
      state.deletedFolders.push({ id: f.id, at: now });
      row.remove();
      if (rows.children.length < 2) {
        rows.querySelectorAll(".fdel").forEach(function (el) { el.style.display = "none"; });
      }
      render();
      scheduleSave();
    });
    bot.appendChild(del);
    if (state.folders.length < 2) del.style.display = "none";
    row.appendChild(bot);

    return row;
  }

  document.getElementById("cog").addEventListener("click", openSheet);

  function savePrefs() {
    lsSet(LS_PREFS, { cat: current, filter: filter, showDone: showDone });
  }

  /* ---------- boot ---------- */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("app-state").textContent); } catch (e) {}
  state = merge(embedded, lsGet(LS_STATE));

  var prefs = lsGet(LS_PREFS);
  if (prefs) {
    var ids = { all: true };
    state.folders.forEach(function (f) { ids[f.id] = true; });
    if (ids[prefs.cat] && prefs.cat !== "all") current = prefs.cat;
    if (ids[prefs.filter]) filter = prefs.filter;
    showDone = !!prefs.showDone;
  }

  var draft = ssGet(SS_DRAFT);
  if (draft) input.value = draft;

  render();
  syncEntry();

  getApi().then(function (ns) {
    if (!ns) { canSave = false; setStatus("local", "この端末のみ"); }
    else setStatus("saved", "保存済み");
  });
})();
</script>
