<title>アライナー チェアタイム計算</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F2F5F3;
    --surface: #FFFFFF;
    --surface-2: #E9EFEC;
    --line: #D3DED9;
    --ink: #141F1C;
    --muted: #5B6D68;
    --accent: #0E6F5C;
    --accent-ink: #0A5747;
    --accent-soft: #DCEEE7;
    --on-accent: #FFFFFF;
    --amber: #8F5406;
    --amber-soft: #F6E8D2;
    --shadow: 0 1px 2px rgba(15, 40, 34, .06), 0 8px 24px -16px rgba(15, 40, 34, .28);
    --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1413;
      --surface: #16201E;
      --surface-2: #1E2B28;
      --line: #2C3B37;
      --ink: #E7EFEC;
      --muted: #94A7A2;
      --accent: #4FC3A4;
      --accent-ink: #8FE2CA;
      --accent-soft: #16332B;
      --on-accent: #0D1413;
      --amber: #E4AA5E;
      --amber-soft: #33281A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 26px -18px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1413;
    --surface: #16201E;
    --surface-2: #1E2B28;
    --line: #2C3B37;
    --ink: #E7EFEC;
    --muted: #94A7A2;
    --accent: #4FC3A4;
    --accent-ink: #8FE2CA;
    --accent-soft: #16332B;
    --on-accent: #0D1413;
    --amber: #E4AA5E;
    --amber-soft: #33281A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 26px -18px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 56px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .eyebrow {
    font-family: var(--display);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .18em;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(22px, 5.4vw, 28px);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; max-width: 46em; }

  /* --- summary --- */
  .summary {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 20px;
  }
  .summary-main { display: flex; align-items: baseline; gap: 10px; }
  .slot {
    font-family: var(--display);
    font-weight: 700;
    font-size: 46px;
    line-height: 1;
    letter-spacing: -.01em;
    color: var(--accent-ink);
    font-variant-numeric: tabular-nums;
  }
  .slot-unit { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent-ink); }
  .slot-label {
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .summary-sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .summary-sub b { color: var(--ink); font-weight: 500; }

  /* --- cards --- */
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 12px;
    padding: 14px 18px 10px;
  }
  h2 { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; margin: 0; }
  .hint { color: var(--muted); font-size: 12px; }

  /* --- count rows --- */
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px 14px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row.active { background: var(--accent-soft); }
  .row-name { font-weight: 500; }
  .row-rate { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    font-family: var(--body);
  }
  .stepper button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .stepper input {
    width: 54px; height: 38px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 700;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row-sub {
    min-width: 4.4em;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 13px;
  }
  .row.active .row-sub { color: var(--accent-ink); font-weight: 500; }

  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 0 0 14px 14px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .totals b { color: var(--ink); font-weight: 500; }

  /* --- message --- */
  .msg-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  input[type="text"], textarea, select {
    font-family: var(--body);
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    width: 100%;
  }
  textarea { line-height: 1.85; resize: vertical; min-height: 16em; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font-family: var(--display);
    font-weight: 500;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

  /* --- settings --- */
  details { border-top: 1px solid var(--line); }
  summary {
    list-style: none;
    cursor: pointer;
    padding: 13px 18px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "設定を開く"; font-family: var(--body); font-size: 12px; color: var(--muted); }
  details[open] summary::after { content: "閉じる"; }
  .settings-body { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 14px;
  }
  .grid .field input, .grid .field select { font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; color: var(--muted); }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    letter-spacing: .06em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--amber-soft);
    color: var(--amber);
  }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
  a { color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 420px) {
    .row { grid-template-columns: 1fr auto; }
    .row-sub { grid-column: 2; }
    .stepper { grid-row: 2; grid-column: 1; }
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">ALIGNER CHAIR TIME</p>
    <h1>アライナー来院の所要時間を計算</h1>
    <p class="lede">クリンチェックを見て、処置の数を入れるだけ。予約枠と、患者さんへ送る連絡文がそのまま出ます。</p>
  </header>

  <div class="summary">
    <div class="summary-main">
      <div>
        <span class="slot-label">予約枠</span>
        <span class="slot" id="slot" aria-live="polite">30</span><span class="slot-unit">分</span>
      </div>
    </div>
    <div class="summary-sub">処置時間の合計 <b id="rawTotal">25分</b><br><span id="roundNote">10分単位で切り上げ</span></div>
  </div>

  <section>
    <div class="card-head">
      <h2>処置の数</h2>
      <span class="chip" id="sampleChip">記入例が入っています</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="totals">
      <span>基本（お渡し・チェック・説明） <b id="baseMin">10分</b></span>
      <span>処置 <b id="procMin">15分</b></span>
    </div>
  </section>

  <section>
    <div class="card-head">
      <h2>患者さんへの連絡文</h2>
      <span class="hint">アライナー到着のお知らせ</span>
    </div>
    <div class="msg-body">
      <div class="field">
        <label for="patient">患者さんのお名前</label>
        <input type="text" id="patient" placeholder="山田" autocomplete="off">
      </div>
      <div class="field">
        <label for="message">本文（そのまま編集できます）</label>
        <textarea id="message" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="copyBtn" type="button">本文をコピー</button>
        <button class="btn" id="regenBtn" type="button">本文を作り直す</button>
        <button class="btn" id="resetBtn" type="button">件数をリセット</button>
      </div>
    </div>
  </section>

  <section>
    <details>
      <summary>1件あたりの時間の設定</summary>
      <div class="settings-body">
        <div class="grid" id="rateGrid"></div>
        <div class="grid">
          <div class="field">
            <label for="cfgBase">基本時間（分）</label>
            <input type="number" id="cfgBase" min="0" step="1">
          </div>
          <div class="field">
            <label for="cfgStep">予約枠の丸め（分）</label>
            <select id="cfgStep">
              <option value="5">5分単位</option>
              <option value="10">10分単位</option>
              <option value="15">15分単位</option>
              <option value="30">30分単位</option>
            </select>
          </div>
          <div class="field">
            <label for="cfgMin">最短の予約枠（分）</label>
            <input type="number" id="cfgMin" min="0" step="5">
          </div>
          <div class="field">
            <label for="cfgClinic">医院名</label>
            <input type="text" id="cfgClinic">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="saveBtn" type="button">設定を保存</button>
          <button class="btn" id="defaultBtn" type="button">初期値に戻す</button>
        </div>
        <p class="status" id="cfgStatus">読み込み中…</p>
      </div>
    </details>
  </section>

  <footer>博多ステラ歯科 / CLAUDENOTE</footer>
</div>

<script>
(function () {
  "use strict";

  var ITEMS = [
    { key: "attOff", label: "アタッチメント除去", unit: "個", rate: 2 },
    { key: "attOn",  label: "アタッチメントセット", unit: "個", rate: 3 },
    { key: "btnOff", label: "ボタン除去", unit: "個", rate: 1 },
    { key: "btnOn",  label: "ボタンセット", unit: "個", rate: 2 },
    { key: "ipr",    label: "IPR", unit: "か所", rate: 3 }
  ];

  var DEFAULTS = {
    base: 10,
    step: 10,
    minSlot: 15,
    clinic: "博多ステラ歯科",
    rates: ITEMS.reduce(function (acc, it) { acc[it.key] = it.rate; return acc; }, {})
  };

  var cfg = clone(DEFAULTS);
  var counts = { attOff: 0, attOn: 3, btnOff: 0, btnOn: 0, ipr: 2 };
  var isSample = true;
  var messageEdited = false;
  var dbDoc = null;

  var el = {
    slot: document.getElementById("slot"),
    rawTotal: document.getElementById("rawTotal"),
    roundNote: document.getElementById("roundNote"),
    rows: document.getElementById("rows"),
    baseMin: document.getElementById("baseMin"),
    procMin: document.getElementById("procMin"),
    sampleChip: document.getElementById("sampleChip"),
    patient: document.getElementById("patient"),
    message: document.getElementById("message"),
    copyBtn: document.getElementById("copyBtn"),
    regenBtn: document.getElementById("regenBtn"),
    resetBtn: document.getElementById("resetBtn"),
    rateGrid: document.getElementById("rateGrid"),
    cfgBase: document.getElementById("cfgBase"),
    cfgStep: document.getElementById("cfgStep"),
    cfgMin: document.getElementById("cfgMin"),
    cfgClinic: document.getElementById("cfgClinic"),
    saveBtn: document.getElementById("saveBtn"),
    defaultBtn: document.getElementById("defaultBtn"),
    cfgStatus: document.getElementById("cfgStatus")
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function num(v, fallback) {
    var n = parseFloat(v);
    return isFinite(n) && n >= 0 ? n : fallback;
  }

  function fmt(n) {
    return (Math.round(n * 10) / 10).toString().replace(/\.0$/, "");
  }

  /* ---------- 計算 ---------- */
  function procedureMinutes() {
    return ITEMS.reduce(function (sum, it) {
      return sum + counts[it.key] * cfg.rates[it.key];
    }, 0);
  }

  function totals() {
    var proc = procedureMinutes();
    var raw = cfg.base + proc;
    var step = cfg.step > 0 ? cfg.step : 1;
    var slot = Math.max(cfg.minSlot, Math.ceil(raw / step) * step);
    return { proc: proc, raw: raw, slot: slot };
  }

  /* ---------- 件数の行 ---------- */
  function buildRows() {
    el.rows.textContent = "";
    ITEMS.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "row";
      row.id = "row-" + it.key;

      var name = document.createElement("div");
      name.className = "row-name";
      name.textContent = it.label;
      var rate = document.createElement("span");
      rate.className = "row-rate";
      rate.id = "rate-" + it.key;
      name.appendChild(document.createElement("br"));
      name.appendChild(rate);

      var stepper = document.createElement("div");
      stepper.className = "stepper";
      var minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      minus.setAttribute("aria-label", it.label + "を1減らす");
      var input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.step = "1";
      input.inputMode = "numeric";
      input.id = "count-" + it.key;
      input.setAttribute("aria-label", it.label + "の数");
      var plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", it.label + "を1増やす");
      stepper.appendChild(minus);
      stepper.appendChild(input);
      stepper.appendChild(plus);

      var sub = document.createElement("div");
      sub.className = "row-sub";
      sub.id = "sub-" + it.key;

      row.appendChild(name);
      row.appendChild(stepper);
      row.appendChild(sub);
      el.rows.appendChild(row);

      minus.addEventListener("click", function () { setCount(it.key, counts[it.key] - 1); });
      plus.addEventListener("click", function () { setCount(it.key, counts[it.key] + 1); });
      input.addEventListener("input", function () { setCount(it.key, Math.round(num(input.value, 0)), true); });
      input.addEventListener("blur", function () { input.value = counts[it.key]; });
    });
  }

  function setCount(key, value, fromInput) {
    counts[key] = Math.max(0, Math.min(99, value || 0));
    dropSample();
    render(fromInput ? key : null);
  }

  function dropSample() {
    if (!isSample) return;
    isSample = false;
    el.sampleChip.hidden = true;
  }

  /* ---------- 設定フォーム ---------- */
  function buildRateFields() {
    el.rateGrid.textContent = "";
    ITEMS.forEach(function (it) {
      var field = document.createElement("div");
      field.className = "field";
      var label = document.createElement("label");
      label.setAttribute("for", "rate-input-" + it.key);
      label.textContent = it.label + "（分／1" + it.unit + "）";
      var input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.step = "0.5";
      input.id = "rate-input-" + it.key;
      input.addEventListener("input", function () {
        cfg.rates[it.key] = num(input.value, 0);
        render();
      });
      field.appendChild(label);
      field.appendChild(input);
      el.rateGrid.appendChild(field);
    });
  }

  function fillSettingsForm() {
    ITEMS.forEach(function (it) {
      var input = document.getElementById("rate-input-" + it.key);
      if (input && document.activeElement !== input) input.value = cfg.rates[it.key];
    });
    if (document.activeElement !== el.cfgBase) el.cfgBase.value = cfg.base;
    if (document.activeElement !== el.cfgMin) el.cfgMin.value = cfg.minSlot;
    if (document.activeElement !== el.cfgClinic) el.cfgClinic.value = cfg.clinic;
    el.cfgStep.value = String(cfg.step);
  }

  /* ---------- 連絡文 ---------- */
  function buildMessage() {
    var t = totals();
    var name = (el.patient.value || "").trim();
    var lines = [];
    lines.push((name ? name : "〇〇") + "様");
    lines.push("");
    lines.push("いつもお世話になっております。" + cfg.clinic + "です。");
    lines.push("新しいマウスピース（アライナー）が届きましたのでお知らせいたします。");
    lines.push("");

    var done = ITEMS.filter(function (it) { return counts[it.key] > 0; });
    if (done.length) {
      lines.push("次回のご来院では、次の処置を行います。");
      done.forEach(function (it) {
        lines.push("・" + it.label + "：" + counts[it.key] + it.unit);
      });
      lines.push("");
      lines.push("お時間は約" + t.slot + "分を予定しております。");
    } else {
      lines.push("次回はアライナーのお渡しと確認のみですので、約" + t.slot + "分で終わります。");
    }
    lines.push("");
    lines.push("ご都合のよい日時をお知らせください。よろしくお願いいたします。");
    return lines.join("\n");
  }

  function refreshMessage(force) {
    if (messageEdited && !force) return;
    el.message.value = buildMessage();
    messageEdited = false;
  }

  /* ---------- 描画 ---------- */
  function render(skipInputKey) {
    var t = totals();
    el.slot.textContent = fmt(t.slot);
    el.rawTotal.textContent = fmt(t.raw) + "分";
    el.roundNote.textContent = fmt(cfg.step) + "分単位で切り上げ・最短" + fmt(cfg.minSlot) + "分";
    el.baseMin.textContent = fmt(cfg.base) + "分";
    el.procMin.textContent = fmt(t.proc) + "分";

    ITEMS.forEach(function (it) {
      var input = document.getElementById("count-" + it.key);
      if (input && it.key !== skipInputKey) input.value = counts[it.key];
      var row = document.getElementById("row-" + it.key);
      if (row) row.classList.toggle("active", counts[it.key] > 0);
      var rate = document.getElementById("rate-" + it.key);
      if (rate) rate.textContent = fmt(cfg.rates[it.key]) + "分／1" + it.unit;
      var sub = document.getElementById("sub-" + it.key);
      if (sub) sub.textContent = counts[it.key] > 0 ? fmt(counts[it.key] * cfg.rates[it.key]) + "分" : "—";
    });

    fillSettingsForm();
    refreshMessage(false);
  }

  /* ---------- 保存（全スタッフ共有 → 端末保存の順） ---------- */
  var LS_KEY = "aligner-chairtime-config";

  function normalize(raw) {
    var next = clone(DEFAULTS);
    if (!raw || typeof raw !== "object") return next;
    next.base = num(raw.base, DEFAULTS.base);
    next.step = num(raw.step, DEFAULTS.step) || DEFAULTS.step;
    next.minSlot = num(raw.minSlot, DEFAULTS.minSlot);
    next.clinic = typeof raw.clinic === "string" && raw.clinic.trim() ? raw.clinic.trim() : DEFAULTS.clinic;
    ITEMS.forEach(function (it) {
      next.rates[it.key] = num(raw.rates && raw.rates[it.key], DEFAULTS.rates[it.key]);
    });
    return next;
  }

  function readLocal() {
    try {
      var raw = window.localStorage.getItem(LS_KEY);
      if (raw) { cfg = normalize(JSON.parse(raw)); render(); }
    } catch (e) { /* 非公開ウィンドウなどでは無視 */ }
  }

  function writeLocal() {
    try { window.localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) { /* 無視 */ }
  }

  function collectSettings() {
    cfg.base = num(el.cfgBase.value, DEFAULTS.base);
    cfg.step = num(el.cfgStep.value, DEFAULTS.step) || DEFAULTS.step;
    cfg.minSlot = num(el.cfgMin.value, DEFAULTS.minSlot);
    cfg.clinic = (el.cfgClinic.value || "").trim() || DEFAULTS.clinic;
    ITEMS.forEach(function (it) {
      var input = document.getElementById("rate-input-" + it.key);
      if (input) cfg.rates[it.key] = num(input.value, DEFAULTS.rates[it.key]);
    });
  }

  function status(text) { el.cfgStatus.textContent = text; }

  function saveSettings() {
    collectSettings();
    writeLocal();
    render();
    if (!dbDoc) { status("この端末に保存しました。"); return; }
    status("保存中…");
    dbDoc.set({ base: cfg.base, step: cfg.step, minSlot: cfg.minSlot, clinic: cfg.clinic, rates: cfg.rates })
      .then(function () { status("保存しました。この設定は医院のスタッフ全員に反映されます。"); })
      .catch(function () { status("共有できませんでした。この端末にのみ保存しています。"); });
  }

  /* ---------- 操作 ---------- */
  el.patient.addEventListener("input", function () { messageEdited = false; refreshMessage(true); });
  el.message.addEventListener("input", function () { messageEdited = true; });
  el.regenBtn.addEventListener("click", function () { refreshMessage(true); el.regenBtn.blur(); });
  el.resetBtn.addEventListener("click", function () {
    ITEMS.forEach(function (it) { counts[it.key] = 0; });
    dropSample();
    messageEdited = false;
    render();
  });
  el.saveBtn.addEventListener("click", saveSettings);
  el.defaultBtn.addEventListener("click", function () {
    cfg = clone(DEFAULTS);
    render();
    status("初期値に戻しました。保存するには「設定を保存」を押してください。");
  });
  el.copyBtn.addEventListener("click", function () {
    var text = el.message.value;
    var done = function (ok) {
      el.copyBtn.textContent = ok ? "コピーしました" : "コピーできません（長押しで選択）";
      window.setTimeout(function () { el.copyBtn.textContent = "本文をコピー"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallbackCopy(done); });
    } else {
      fallbackCopy(done);
    }
  });

  function fallbackCopy(done) {
    el.message.focus();
    el.message.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    done(ok);
  }

  /* ---------- 起動 ---------- */
  buildRows();
  buildRateFields();
  readLocal();
  render();
  status("この端末に保存されます。");

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (db) {
      if (!db) return;
      dbDoc = db.doc("settings/chairtime");
      dbDoc.onSnapshot(function (snap) {
        if (snap.exists) {
          cfg = normalize(snap.data());
          writeLocal();
          render();
          status("医院で共有している設定を読み込みました。");
        } else {
          status("まだ共有設定がありません。「設定を保存」でスタッフ全員に共有できます。");
        }
      }, function () {
        dbDoc = null;
        status("この端末に保存されます。");
      });
    }).catch(function () { /* 共有なしで動作 */ });
  }
})();
</script>
