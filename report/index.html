<title>ステラ受付報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">

<script id="app-state" type="application/json">{"v":1,"updatedAt":0,"posts":[],"daily":[],"deleted":[]}</script>

<style>
  :root {
    --ground:      #F2F5F3;
    --surface:     #FFFFFF;
    --surface-2:   #E9EFEC;
    --ink:         #16211E;
    --ink-2:       #566662;
    --ink-3:       #8B9A96;
    --line:        #DBE4E0;
    --accent:      #12635B;
    --accent-ink:  #FFFFFF;
    --danger:      #A33B4F;
    --scrim:       rgba(12,30,26,.44);
    --reception:   #12635B;
    --director:    #A33B4F;
    --alert:       #8E5A14;
    --tint-accent: #DCEDE9;
    --tint-alert:  #F5ECDC;
    --shadow-up:   0 -1px 0 var(--line), 0 -10px 24px -18px rgba(15,40,34,.5);
    --shadow-card: 0 1px 1px rgba(20,45,38,.04);
    --radius:      14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0E1412;
      --surface:     #172520;
      --surface-2:   #1E2E29;
      --ink:         #E7EEEA;
      --ink-2:       #A2B2AD;
      --ink-3:       #778783;
      --line:        #26332F;
      --accent:      #57B9AC;
      --accent-ink:  #06211E;
      --danger:      #E5849A;
      --scrim:       rgba(0,0,0,.62);
      --reception:   #57B9AC;
      --director:    #E5849A;
      --alert:       #DBA75F;
      --tint-accent: #12302C;
      --tint-alert:  #2C2314;
      --shadow-up:   0 -1px 0 var(--line), 0 -10px 24px -18px rgba(0,0,0,.9);
      --shadow-card: 0 1px 1px rgba(0,0,0,.18);
    }
  }
  :root[data-theme="dark"] {
    --ground:      #0E1412;
    --surface:     #172520;
    --surface-2:   #1E2E29;
    --ink:         #E7EEEA;
    --ink-2:       #A2B2AD;
    --ink-3:       #778783;
    --line:        #26332F;
    --accent:      #57B9AC;
    --accent-ink:  #06211E;
    --danger:      #E5849A;
    --scrim:       rgba(0,0,0,.62);
    --reception:   #57B9AC;
    --director:    #E5849A;
    --alert:       #DBA75F;
    --tint-accent: #12302C;
    --tint-alert:  #2C2314;
    --shadow-up:   0 -1px 0 var(--line), 0 -10px 24px -18px rgba(0,0,0,.9);
    --shadow-card: 0 1px 1px rgba(0,0,0,.18);
  }

  .r-reception { --role: var(--reception); }
  .r-director  { --role: var(--director); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
  }

  /* ---------- header ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px 8px;
  }
  .brand { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--ink-3);
    margin: 0;
  }
  h1 {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.2;
    margin: 1px 0 0;
    letter-spacing: .01em;
  }
  .rolechip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1.5px solid var(--role, var(--line));
    color: var(--role, var(--ink-2));
    border-radius: 999px;
    padding: 5px 12px;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .rolechip svg { width: 12px; height: 12px; opacity: .7; }

  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ink-3);
    white-space: nowrap;
    padding: 0 16px 8px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .status[data-state="saving"] .dot { background: var(--ink-3); animation: pulse 1.1s ease-in-out infinite; }
  .status[data-state="error"]  .dot { background: var(--danger); }
  .status[data-state="local"]  .dot { background: var(--ink-3); }
  @keyframes pulse { 50% { opacity: .25; } }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 0 16px 10px;
  }
  .tab {
    flex: none;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tab .n {
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
  }
  .tab.hot { border-color: var(--alert); color: var(--alert); }
  .tab.hot .n { color: var(--alert); }
  .tab[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--ground);
  }
  .tab[aria-pressed="true"] .n { color: var(--ground); opacity: .65; }

  /* ---------- feed ---------- */
  .feed {
    flex: 1;
    padding: 14px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .daypill {
    align-self: center;
    margin: 8px 0 3px;
    padding: 3px 13px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .post {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--role);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 11px 13px 10px;
  }
  .post.is-closed { opacity: .62; }

  .phead {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 3px;
  }
  .who {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--role);
    letter-spacing: .04em;
  }
  .when {
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .ptext {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .pill {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: .03em;
  }
  .pill.wait { background: var(--tint-alert); color: var(--alert); }
  .pill.fresh { background: var(--tint-accent); color: var(--accent); }
  .pill.done { background: var(--surface-2); color: var(--ink-3); }

  .replies {
    margin-top: 9px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .reply {
    background: var(--surface-2);
    border-radius: 11px;
    padding: 8px 11px;
    border-left: 2px solid var(--role);
  }
  .reply .rhead {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 1px;
  }
  .reply .rtext {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }
  .act {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .act.ghost { margin-left: auto; color: var(--ink-3); }
  .act.confirm { color: var(--danger); border-color: var(--danger); font-weight: 700; }

  .replybox {
    margin-top: 9px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .replybox textarea {
    width: 100%;
    resize: none;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 9px 12px;
    min-height: 70px;
  }
  .replybox .row { display: flex; gap: 7px; }

  /* ---------- daily summary ---------- */
  .daily {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 11px 13px;
  }
  .daily.filled { border-style: solid; border-left: 3px solid var(--ink-3); }
  .daily .dlabel {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: .04em;
    margin-bottom: 3px;
  }
  .daily .dtext {
    margin: 0;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .dadd {
    width: 100%;
    background: none;
    border: 0;
    padding: 2px;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 13.5px;
    color: var(--ink-3);
    cursor: pointer;
    text-align: left;
  }

  .empty {
    margin: 40px 8px;
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
    line-height: 1.9;
  }
  .empty strong {
    display: block;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-2);
    margin-bottom: 4px;
  }

  .banner {
    margin: 12px 16px 0;
    padding: 10px 13px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-2);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .banner button {
    margin-left: auto;
    flex: none;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 999px;
    padding: 5px 12px;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 12px;
    cursor: pointer;
  }

  /* ---------- compose ---------- */
  .compose {
    position: sticky;
    bottom: 0;
    z-index: 20;
    background: var(--surface);
    box-shadow: var(--shadow-up);
    padding: 9px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .toggle-row { padding-bottom: 8px; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
  }
  .toggle .mark {
    width: 15px; height: 15px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .toggle .mark svg { width: 10px; height: 10px; opacity: 0; color: var(--accent-ink); }
  .toggle[aria-pressed="true"] { border-color: var(--alert); color: var(--alert); }
  .toggle[aria-pressed="true"] .mark { background: var(--alert); border-color: var(--alert); }
  .toggle[aria-pressed="true"] .mark svg { opacity: 1; color: var(--surface); }

  .entry {
    display: flex;
    align-items: flex-end;
    gap: 9px;
  }
  .entry textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px 15px;
    height: 44px;
    max-height: 148px;
    overflow-y: auto;
  }
  .entry textarea::placeholder { color: var(--ink-3); }

  .send {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity .15s ease, transform .12s ease;
  }
  .send svg { width: 21px; height: 21px; }
  .send:disabled { opacity: .3; cursor: default; }
  .send:not(:disabled):active { transform: scale(.93); }

  .hint {
    margin: 7px 2px 0;
    font-size: 11px;
    color: var(--ink-3);
    text-align: center;
  }

  /* ---------- role sheet ---------- */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: var(--scrim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 88dvh;
    overflow-y: auto;
    background: var(--ground);
    border-radius: 18px 18px 0 0;
    padding: 6px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .grip {
    width: 36px; height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 6px auto 12px;
  }
  .sheet h2 {
    margin: 0 0 4px;
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .sheet p {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--ink-3);
    line-height: 1.7;
  }
  .rolepick { display: flex; flex-direction: column; gap: 10px; }
  .rolebtn {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-left: 3px solid var(--role);
    border-radius: var(--radius);
    padding: 14px 15px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
  }
  .rolebtn[aria-pressed="true"] { border-color: var(--role); background: var(--surface); }
  .rolebtn .mark {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--role);
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rolebtn[aria-pressed="true"] .mark { background: var(--role); }
  .rolebtn .mark svg { width: 10px; height: 10px; opacity: 0; color: var(--surface); }
  .rolebtn[aria-pressed="true"] .mark svg { opacity: 1; }
  .rolebtn .rname {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
    font-weight: 500;
  }
  .rolebtn .rdesc { font-size: 12px; color: var(--ink-3); line-height: 1.5; }

  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <p class="eyebrow">博多ステラ歯科</p>
        <h1>受付報告</h1>
      </div>
      <button class="rolechip" id="rolechip">
        <span id="rolename">—</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="status" id="status" data-state="saved">
      <span class="dot"></span><span id="status-text">保存済み</span>
    </div>
  </header>

  <div id="banner-slot"></div>
  <main class="feed" id="feed"></main>

  <div class="compose" id="compose">
    <div class="toggle-row">
      <button class="toggle" id="needs" aria-pressed="false">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span id="needs-label">返事がほしい</span>
      </button>
    </div>
    <div class="entry">
      <textarea id="input" rows="1" placeholder="報告・相談を入力…" aria-label="報告を入力"></textarea>
      <button class="send" id="send" disabled aria-label="送る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ROLES = {
    reception: { name: "受付", cls: "r-reception" },
    director:  { name: "院長", cls: "r-director" }
  };
  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  var LS_STATE = "stella-report/state/v1";
  var LS_PREFS = "stella-report/prefs/v1";
  var SS_DRAFT = "stella-report/draft/v1";
  var SS_REPLY = "stella-report/reply/v1";
  var TOMBSTONE_MS = 60 * 24 * 60 * 60 * 1000;
  var TICK = '<path d="M20 6L9 17l-5-5"></path>';

  var state = { v: 1, updatedAt: 0, posts: [], daily: [], deleted: [] };
  var role = null;          // null until the viewer says who they are
  var tab = "all";
  var needsReply = false;
  var openReply = null;     // post id whose reply box is open
  var editingDaily = null;  // date key being edited
  var readOnly = false;
  var canSave = true;
  var saving = false;
  var dirty = false;
  var saveTimer = null;
  var api = null;
  var apiPromise = null;

  /* ---------- storage helpers (never throw) ---------- */
  function lsGet(key) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function ssGet(key) {
    try { var v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function ssSet(key, val) {
    try {
      if (val === null || val === undefined) sessionStorage.removeItem(key);
      else sessionStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- state shape ---------- */
  function normalize(raw) {
    var s = { v: 1, updatedAt: 0, posts: [], daily: [], deleted: [] };
    if (!raw || typeof raw !== "object") return s;
    s.updatedAt = Number(raw.updatedAt) || 0;

    if (Array.isArray(raw.posts)) {
      raw.posts.forEach(function (p) {
        if (!p || !p.id || typeof p.text !== "string") return;
        var replies = [];
        if (Array.isArray(p.replies)) {
          p.replies.forEach(function (r) {
            if (!r || !r.id || typeof r.text !== "string") return;
            replies.push({
              id: String(r.id),
              text: r.text,
              from: ROLES[r.from] ? r.from : "reception",
              at: Number(r.at) || 0
            });
          });
        }
        replies.sort(function (a, b) { return a.at - b.at; });
        s.posts.push({
          id: String(p.id),
          text: p.text,
          from: ROLES[p.from] ? p.from : "reception",
          needsReply: !!p.needsReply,
          createdAt: Number(p.createdAt) || 0,
          updatedAt: Number(p.updatedAt) || Number(p.createdAt) || 0,
          ack: Number(p.ack) || 0,
          closedAt: Number(p.closedAt) || 0,
          replies: replies
        });
      });
    }

    if (Array.isArray(raw.daily)) {
      raw.daily.forEach(function (d) {
        if (!d || typeof d.date !== "string" || typeof d.text !== "string") return;
        s.daily.push({ date: d.date, text: d.text, updatedAt: Number(d.updatedAt) || 0 });
      });
    }

    if (Array.isArray(raw.deleted)) {
      raw.deleted.forEach(function (d) {
        if (d && d.id) s.deleted.push({ id: String(d.id), at: Number(d.at) || 0 });
      });
    }
    return s;
  }

  /* Two phones can write at once, and a save reloads every open view, so a
     device that lost the race folds its own copy back in on the way in. */
  function merge(a, b) {
    a = normalize(a); b = normalize(b);
    var cutoff = Date.now() - TOMBSTONE_MS;

    var tombs = {};
    a.deleted.concat(b.deleted).forEach(function (d) {
      if (!tombs[d.id] || d.at > tombs[d.id].at) tombs[d.id] = d;
    });

    var byId = {};
    a.posts.concat(b.posts).forEach(function (p) {
      var prev = byId[p.id];
      if (!prev) { byId[p.id] = p; return; }
      var win = p.updatedAt > prev.updatedAt ? p : prev;
      var lose = win === p ? prev : p;
      byId[p.id] = {
        id: win.id,
        text: win.text,
        from: win.from,
        needsReply: win.needsReply,
        createdAt: win.createdAt,
        updatedAt: win.updatedAt,
        // a confirmation is never taken back, so the earlier one still counts
        ack: Math.max(win.ack, lose.ack),
        closedAt: win.closedAt,
        replies: unionReplies(win.replies, lose.replies)
      };
    });

    var posts = [];
    Object.keys(byId).forEach(function (id) {
      var p = byId[id];
      if (tombs[id] && tombs[id].at >= p.updatedAt) return;
      posts.push(p);
    });
    posts.sort(function (x, y) { return x.createdAt - y.createdAt; });

    var byDate = {};
    a.daily.concat(b.daily).forEach(function (d) {
      var prev = byDate[d.date];
      if (!prev || d.updatedAt > prev.updatedAt) byDate[d.date] = d;
    });
    var daily = Object.keys(byDate).map(function (k) { return byDate[k]; });

    var deleted = [];
    Object.keys(tombs).forEach(function (id) {
      if (tombs[id].at >= cutoff) deleted.push(tombs[id]);
    });

    return { v: 1, updatedAt: Math.max(a.updatedAt, b.updatedAt), posts: posts, daily: daily, deleted: deleted };
  }

  function unionReplies(x, y) {
    var byId = {};
    x.concat(y).forEach(function (r) { if (!byId[r.id]) byId[r.id] = r; });
    return Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return a.at - b.at; });
  }

  /* ---------- status model ---------- */
  function other(r) { return r === "reception" ? "director" : "reception"; }

  function hasReplyFrom(p, who) {
    return p.replies.some(function (r) { return r.from === who; });
  }

  function statusOf(p) {
    if (p.closedAt) return { label: "完了", kind: "done" };
    if (p.needsReply) {
      if (!hasReplyFrom(p, other(p.from))) {
        return { label: p.from === "reception" ? "返事待ち" : "未対応", kind: "wait" };
      }
      return { label: "返信あり", kind: "fresh" };
    }
    if (!p.ack) return { label: "未読", kind: "wait" };
    return { label: "確認済み", kind: "done" };
  }

  /* Does this post wait on the person looking at it right now?
     A question from the receptionist is settled by the director answering it;
     an instruction from the director is settled by the work being done, so it
     stays on the receptionist's list until someone marks it 完了. */
  function needsMe(p) {
    if (p.closedAt || !role) return false;
    if (p.from === role) {
      // my own post: a reply came back and the thread is still open
      return hasReplyFrom(p, other(role));
    }
    if (p.needsReply) {
      return role === "reception" ? true : !hasReplyFrom(p, role);
    }
    return !p.ack;
  }

  /* ---------- saving ---------- */
  function getApi() {
    if (apiPromise) return apiPromise;
    if (!window.claude || typeof window.claude.use !== "function") {
      apiPromise = Promise.resolve(null);
      return apiPromise;
    }
    apiPromise = window.claude.use("artifact").then(function (ns) {
      api = ns || null;
      return api;
    }, function () { return null; });
    return apiPromise;
  }

  function setStatus(kind, text) {
    document.getElementById("status").setAttribute("data-state", kind);
    document.getElementById("status-text").textContent = text;
  }

  function scheduleSave() {
    dirty = true;
    lsSet(LS_STATE, state);
    if (!canSave) { setStatus("local", "この端末のみ"); return; }
    setStatus("saving", "保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1400);
  }

  function stateJson() {
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  /* Saving rewrites this page's own stored source with the new state block
     and publishes it. Every open view reloads to it, which is how the other
     person's screen gets the new report. */
  function save() {
    if (saving || !dirty) return;
    getApi().then(function (ns) {
      if (!ns) {
        canSave = false;
        setStatus("local", "この端末のみ");
        return;
      }
      saving = true;
      dirty = false;
      state.updatedAt = Date.now();
      lsSet(LS_STATE, state);

      var OPEN = "<" + 'script id="app-state" type="application/json">';
      var CLOSE = "<" + "/script>";
      fetch(location.pathname, { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (src) {
          var i = src.indexOf(OPEN);
          var j = i < 0 ? -1 : src.indexOf(CLOSE, i);
          if (i < 0 || j < 0 || !/^\s*<!doctype/i.test(src)) {
            throw { code: "page_unreadable", message: "保存先が見つかりません" };
          }
          return ns.publish(src.slice(0, i + OPEN.length) + stateJson() + src.slice(j));
        })
        .then(function () {
          saving = false;
          setStatus("saved", "保存済み");
          if (dirty) scheduleSave();
        }, function (err) {
          saving = false;
          dirty = true;
          handleSaveError(err);
        });
    });
  }

  function handleSaveError(err) {
    var code = (err && err.code) || "upstream_error";
    if (code === "conflict") {
      // The other side saved first; this view is already reloading to their
      // version and folds this copy back in from localStorage on the way.
      setStatus("saving", "更新中…");
      return;
    }
    if (code === "not_writer" || code === "not_granted" ||
        code === "consent_required" || code === "not_declared") {
      canSave = false;
      readOnly = true;
      setStatus("local", "閲覧のみ");
      render();
      return;
    }
    if (code === "rate_limited") {
      setStatus("saving", "保存中…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 5000);
      return;
    }
    setStatus("error", "保存できません");
    showRetryBanner();
  }

  function showRetryBanner() {
    var slot = document.getElementById("banner-slot");
    if (slot.querySelector(".banner")) return;
    var b = document.createElement("div");
    b.className = "banner";
    var msg = document.createElement("span");
    msg.textContent = "送れませんでした。内容はこの端末に残っています。";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "再試行";
    btn.addEventListener("click", function () {
      slot.innerHTML = "";
      setStatus("saving", "保存中…");
      save();
    });
    b.appendChild(msg);
    b.appendChild(btn);
    slot.appendChild(b);
  }

  /* ---------- actions ---------- */
  function findPost(id) {
    var found = null;
    state.posts.forEach(function (p) { if (p.id === id) found = p; });
    return found;
  }

  function addPost(text) {
    var now = Date.now();
    state.posts.push({
      id: newId(),
      text: text,
      from: role,
      needsReply: needsReply,
      createdAt: now,
      updatedAt: now,
      ack: 0,
      closedAt: 0,
      replies: []
    });
    render();
    scheduleSave();
  }

  function addReply(id, text) {
    var p = findPost(id);
    if (!p) return;
    var now = Date.now();
    p.replies.push({ id: newId(), text: text, from: role, at: now });
    p.updatedAt = now;
    if (p.from !== role && !p.ack) p.ack = now;   // replying is also confirming
    render();
    scheduleSave();
  }

  function ackPost(id) {
    var p = findPost(id);
    if (!p || p.ack) return;
    p.ack = Date.now();
    p.updatedAt = p.ack;
    render();
    scheduleSave();
  }

  function closePost(id, closed) {
    var p = findPost(id);
    if (!p) return;
    p.closedAt = closed ? Date.now() : 0;
    p.updatedAt = Date.now();
    render();
    scheduleSave();
  }

  function deletePost(id) {
    var keep = [];
    var hit = false;
    state.posts.forEach(function (p) {
      if (p.id === id) hit = true; else keep.push(p);
    });
    if (!hit) return;
    state.posts = keep;
    state.deleted.push({ id: id, at: Date.now() });
    render();
    scheduleSave();
  }

  function setDaily(date, text) {
    var hit = null;
    state.daily.forEach(function (d) { if (d.date === date) hit = d; });
    if (!text.trim()) {
      if (hit) state.daily = state.daily.filter(function (d) { return d.date !== date; });
    } else if (hit) {
      hit.text = text;
      hit.updatedAt = Date.now();
    } else {
      state.daily.push({ date: date, text: text, updatedAt: Date.now() });
    }
    render();
    scheduleSave();
  }

  function dailyOf(date) {
    var hit = null;
    state.daily.forEach(function (d) { if (d.date === date) hit = d; });
    return hit;
  }

  /* ---------- dates ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function dayLabel(key) {
    var parts = key.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var today = new Date();
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var diff = Math.round((t0 - d) / 86400000);
    var base = (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WEEK[d.getDay()] + ")";
    if (diff === 0) return "今日 " + base;
    if (diff === 1) return "昨日 " + base;
    return base;
  }

  function hhmm(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* ---------- rendering ---------- */
  function icon(path, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) +
           '" stroke-linecap="round" stroke-linejoin="round">' + path + "</svg>";
  }

  function button(cls, label, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function renderTabs() {
    var box = document.getElementById("tabs");
    box.innerHTML = "";
    var mine = state.posts.filter(needsMe).length;
    var defs = [
      { id: "all", label: "すべて", n: null },
      { id: "mine", label: "要対応", n: mine },
      { id: "today", label: "今日", n: null }
    ];
    defs.forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (d.id === "mine" && mine ? " hot" : "");
      b.setAttribute("aria-pressed", tab === d.id ? "true" : "false");
      var t = document.createElement("span");
      t.textContent = d.label;
      b.appendChild(t);
      if (d.n !== null) {
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = d.n;
        b.appendChild(n);
      }
      b.addEventListener("click", function () { tab = d.id; savePrefs(); render(); });
      box.appendChild(b);
    });
  }

  function postEl(p) {
    var st = statusOf(p);
    var card = document.createElement("article");
    card.className = "post " + ROLES[p.from].cls + (p.closedAt ? " is-closed" : "");

    var head = document.createElement("div");
    head.className = "phead";
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = ROLES[p.from].name;
    var when = document.createElement("span");
    when.className = "when";
    when.textContent = hhmm(p.createdAt);
    head.appendChild(who);
    head.appendChild(when);
    card.appendChild(head);

    var text = document.createElement("p");
    text.className = "ptext";
    text.textContent = p.text;
    card.appendChild(text);

    var pills = document.createElement("div");
    pills.className = "pills";
    if (p.needsReply && !p.closedAt) {
      var np = document.createElement("span");
      np.className = "pill wait";
      np.textContent = p.from === "reception" ? "要返事" : "対応おねがい";
      pills.appendChild(np);
    }
    var sp = document.createElement("span");
    sp.className = "pill " + st.kind;
    sp.textContent = st.label;
    pills.appendChild(sp);
    card.appendChild(pills);

    if (p.replies.length) {
      var rs = document.createElement("div");
      rs.className = "replies";
      p.replies.forEach(function (r) {
        var rb = document.createElement("div");
        rb.className = "reply " + ROLES[r.from].cls;
        var rh = document.createElement("div");
        rh.className = "rhead";
        var rw = document.createElement("span");
        rw.className = "who";
        rw.textContent = ROLES[r.from].name;
        var rt = document.createElement("span");
        rt.className = "when";
        rt.textContent = hhmm(r.at);
        rh.appendChild(rw);
        rh.appendChild(rt);
        var rtx = document.createElement("p");
        rtx.className = "rtext";
        rtx.textContent = r.text;
        rb.appendChild(rh);
        rb.appendChild(rtx);
        rs.appendChild(rb);
      });
      card.appendChild(rs);
    }

    if (readOnly || !role) return card;

    if (openReply === p.id) {
      card.appendChild(replyBox(p));
      return card;
    }

    var acts = document.createElement("div");
    acts.className = "actions";

    if (!p.closedAt) {
      if (p.from !== role && !p.ack) {
        acts.appendChild(button("act primary", "確認", function () { ackPost(p.id); }));
      }
      acts.appendChild(button("act", "返信", function () {
        openReply = p.id;
        ssSet(SS_REPLY, { id: p.id, text: "" });
        render();
      }));
      acts.appendChild(button("act", "完了", function () { closePost(p.id, true); }));
    } else {
      acts.appendChild(button("act", "戻す", function () { closePost(p.id, false); }));
    }

    if (p.from === role) {
      var del = button("act ghost", "削除", function () {
        if (del.classList.contains("confirm")) { deletePost(p.id); return; }
        del.classList.add("confirm");
        del.textContent = "もう一度で削除";
        setTimeout(function () {
          del.classList.remove("confirm");
          del.textContent = "削除";
        }, 3000);
      });
      acts.appendChild(del);
    }

    card.appendChild(acts);
    return card;
  }

  function replyBox(p) {
    var wrap = document.createElement("div");
    wrap.className = "replybox";
    var ta = document.createElement("textarea");
    ta.setAttribute("aria-label", "返信を入力");
    ta.placeholder = role === "director" ? "返事・指示を入力…" : "返信を入力…";
    var stash = ssGet(SS_REPLY);
    if (stash && stash.id === p.id) ta.value = stash.text || "";
    ta.addEventListener("input", function () {
      ssSet(SS_REPLY, { id: p.id, text: ta.value });
    });

    var row = document.createElement("div");
    row.className = "row";
    var sendBtn = button("act primary", "送る", function () {
      var t = ta.value.trim();
      if (!t) return;
      openReply = null;
      ssSet(SS_REPLY, null);
      addReply(p.id, t);
    });
    var cancel = button("act", "やめる", function () {
      openReply = null;
      ssSet(SS_REPLY, null);
      render();
    });
    row.appendChild(sendBtn);
    row.appendChild(cancel);

    wrap.appendChild(ta);
    wrap.appendChild(row);
    setTimeout(function () { ta.focus(); }, 0);
    return wrap;
  }

  function dailyEl(key) {
    var rec = dailyOf(key);
    var isToday = key === dayKey(Date.now());

    if (editingDaily === key) {
      var box = document.createElement("div");
      box.className = "daily filled";
      var lab = document.createElement("div");
      lab.className = "dlabel";
      lab.textContent = "この日のまとめ";
      var ta = document.createElement("textarea");
      ta.setAttribute("aria-label", "この日のまとめ");
      ta.placeholder = "来院数、気づいたこと、引き継ぎなど";
      ta.value = rec ? rec.text : "";
      ta.style.cssText = "width:100%;resize:none;font-family:inherit;font-size:15px;line-height:1.55;" +
        "color:var(--ink);background:var(--ground);border:1px solid var(--line);" +
        "border-radius:11px;padding:9px 12px;min-height:84px;margin-top:6px";
      var row = document.createElement("div");
      row.className = "row";
      row.style.cssText = "display:flex;gap:7px;margin-top:8px";
      row.appendChild(button("act primary", "保存", function () {
        editingDaily = null;
        setDaily(key, ta.value);
      }));
      row.appendChild(button("act", "やめる", function () {
        editingDaily = null;
        render();
      }));
      box.appendChild(lab);
      box.appendChild(ta);
      box.appendChild(row);
      setTimeout(function () { ta.focus(); }, 0);
      return box;
    }

    if (rec) {
      var filled = document.createElement("div");
      filled.className = "daily filled";
      var l2 = document.createElement("div");
      l2.className = "dlabel";
      l2.textContent = "この日のまとめ";
      var tx = document.createElement("p");
      tx.className = "dtext";
      tx.textContent = rec.text;
      filled.appendChild(l2);
      filled.appendChild(tx);
      if (!readOnly && role) {
        var acts = document.createElement("div");
        acts.className = "actions";
        acts.appendChild(button("act", "書き直す", function () { editingDaily = key; render(); }));
        filled.appendChild(acts);
      }
      return filled;
    }

    // writing the day's summary is the receptionist's job; the director only
    // sees it once there is something to read
    if (isToday && !readOnly && role === "reception") {
      var add = document.createElement("div");
      add.className = "daily";
      add.appendChild(button("dadd", "＋ 今日のまとめを書く", function () {
        editingDaily = key;
        render();
      }));
      return add;
    }
    return null;
  }

  function render() {
    renderRoleChip();
    renderTabs();

    var feed = document.getElementById("feed");
    feed.innerHTML = "";

    var today = dayKey(Date.now());
    var shown = state.posts.filter(function (p) {
      if (tab === "mine") return needsMe(p);
      if (tab === "today") return dayKey(p.createdAt) === today;
      return true;
    });

    // today sits at the top, so its summary box goes first even on a day
    // that has no reports yet
    var hasToday = shown.some(function (p) { return dayKey(p.createdAt) === today; });
    if (tab !== "mine" && !hasToday) {
      var todayBox = dailyEl(today);
      if (todayBox) {
        feed.appendChild(daypillEl(today));
        feed.appendChild(todayBox);
      }
    }

    if (!shown.length) {
      var e = document.createElement("div");
      e.className = "empty";
      var h = document.createElement("strong");
      var sub = "";
      if (tab === "mine") {
        h.textContent = "対応することはありません";
        sub = "返事待ちも未確認もゼロです。";
      } else if (tab === "today") {
        h.textContent = "今日の報告はまだありません";
        sub = "下の入力欄からどうぞ。";
      } else if (!state.posts.length) {
        h.textContent = "まだ報告はありません";
        sub = role === "director"
          ? "受付からの報告がここに並びます。"
          : "院長に伝えたいことを、その場で。";
      } else {
        h.textContent = "表示するものがありません";
        sub = "";
      }
      e.appendChild(h);
      e.appendChild(document.createTextNode(sub));
      feed.appendChild(e);
    } else {
      // newest day first, newest post first inside each day
      var groups = {};
      var order = [];
      shown.slice().sort(function (a, b) { return b.createdAt - a.createdAt; })
        .forEach(function (p) {
          var k = dayKey(p.createdAt);
          if (!groups[k]) { groups[k] = []; order.push(k); }
          groups[k].push(p);
        });

      order.forEach(function (k) {
        feed.appendChild(daypillEl(k));
        if (tab !== "mine") {
          var d = dailyEl(k);
          if (d) feed.appendChild(d);
        }
        groups[k].forEach(function (p) { feed.appendChild(postEl(p)); });
      });
    }

    document.getElementById("compose").style.display = (readOnly || !role) ? "none" : "";
    document.getElementById("needs-label").textContent =
      role === "director" ? "対応してほしい" : "返事がほしい";
    document.getElementById("input").placeholder =
      role === "director" ? "指示・連絡を入力…" : "報告・相談を入力…";
    document.getElementById("hint").textContent = readOnly
      ? ""
      : (role === "director"
          ? "「対応してほしい」を付けると、受付の要対応に入ります"
          : "「返事がほしい」を付けると、院長の要対応に入ります");
  }

  function daypillEl(key) {
    var pill = document.createElement("div");
    pill.className = "daypill";
    pill.textContent = dayLabel(key);
    return pill;
  }

  /* ---------- role ---------- */
  function renderRoleChip() {
    var chip = document.getElementById("rolechip");
    chip.className = "rolechip" + (role ? " " + ROLES[role].cls : "");
    document.getElementById("rolename").textContent = role ? ROLES[role].name : "だれ？";
  }

  function openRoleSheet(forced) {
    if (document.querySelector(".scrim")) return;
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    scrim.appendChild(sheet);

    var grip = document.createElement("div");
    grip.className = "grip";

    var h2 = document.createElement("h2");

    sheet.appendChild(h2);
    sheet.appendChild(p);

    var pick = document.createElement("div");
    pick.className = "rolepick";
    [
      { id: "reception", desc: "院長に報告・相談を上げる。院長からの指示に対応する。" },

      mark.innerHTML = icon(TICK, 3.4);
      var txt = document.createElement("span");
      var nm = document.createElement("div");
      nm.className = "rname";
      nm.textContent = ROLES[o.id].name;
      var ds = document.createElement("div");
      ds.className = "rdesc";
      ds.textContent = o.desc;
      txt.appendChild(nm);
      txt.appendChild(ds);
      b.appendChild(mark);
      b.appendChild(txt);
      b.addEventListener("click", function () {
        role = o.id;
        savePrefs();
        close();
      });
      pick.appendChild(b);
    });
    sheet.appendChild(pick);

    if (!forced) {
      scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
      document.addEventListener("keydown", onKey);
    }
    document.getElementById("app").appendChild(scrim);

    function onKey(e) { if (e.key === "Escape") close(); }
    function close() {
      document.removeEventListener("keydown", onKey);
      scrim.remove();
      render();
    }
  }

  document.getElementById("rolechip").addEventListener("click", function () {
    openRoleSheet(false);
  });

  /* ---------- compose ---------- */
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var needsBtn = document.getElementById("needs");

  function syncEntry() {
    input.style.height = "44px";
    input.style.height = Math.min(input.scrollHeight + 2, 148) + "px";
    send.disabled = !input.value.trim();
    ssSet(SS_DRAFT, input.value);
  }

  function submit() {
    var text = input.value.trim();
    if (!text || !role) return;
    addPost(text);
    input.value = "";
    ssSet(SS_DRAFT, null);
    needsReply = false;
    needsBtn.setAttribute("aria-pressed", "false");
    syncEntry();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  input.addEventListener("input", syncEntry);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing &&
        matchMedia("(pointer: fine)").matches) {
      e.preventDefault();
      submit();
    }
  });
  send.addEventListener("click", submit);
  needsBtn.addEventListener("click", function () {
    needsReply = !needsReply;
    needsBtn.setAttribute("aria-pressed", needsReply ? "true" : "false");
  });

  function savePrefs() {
    lsSet(LS_PREFS, { role: role, tab: tab });
  }

  /* ---------- boot ---------- */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("app-state").textContent); } catch (e) {}
  state = merge(embedded, lsGet(LS_STATE));

  var prefs = lsGet(LS_PREFS);
  if (prefs) {
    if (ROLES[prefs.role]) role = prefs.role;
    if (prefs.tab === "all" || prefs.tab === "mine" || prefs.tab === "today") tab = prefs.tab;
  }

  var draft = ssGet(SS_DRAFT);
  if (typeof draft === "string" && draft) input.value = draft;

  // a save reloads every open view, so a half-typed reply comes back with it
  var stashed = ssGet(SS_REPLY);
  if (stashed && stashed.id && findPost(stashed.id)) openReply = stashed.id;

  render();
  syncEntry();

  if (!role) openRoleSheet(true);

  getApi().then(function (ns) {
    if (!ns) { canSave = false; setStatus("local", "この端末のみ"); }
    else setStatus("saved", "保存済み");
  });
})();
</script>
