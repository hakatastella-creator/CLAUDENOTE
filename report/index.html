  var BY_ID = {};
  MEMBERS.forEach(function (m) { BY_ID[m.id] = m; });
  var UNKNOWN = { id: "", name: "だれか", side: "reception", cls: "c-teal" };

  function member(id) { return BY_ID[id] || UNKNOWN; }

  /* The first version of this page knew only 受付 / 院長. Anything written then
     still has to read correctly. */
  function toMemberId(v) {
    if (BY_ID[v]) return v;
    if (v === "director") return "inchou";
    return "";                        // an unnamed receptionist
  }

  function sideOf(id) { return member(id).side; }

  var WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  var LS_STATE = "stella-report/state/v1";
  var LS_PREFS = "stella-report/prefs/v1";
  var SS_DRAFT = "stella-report/draft/v1";
  var SS_REPLY = "stella-report/reply/v1";
  var TOMBSTONE_MS = 60 * 24 * 60 * 60 * 1000;
  var TICK = '<path d="M20 6L9 17l-5-5"></path>';

  var state = { v: 1, updatedAt: 0, posts: [], daily: [], deleted: [], deletedReplies: [] };
  var me = null;            // member id; null until this device says who it is
  var tab = "all";
  var openReply = null;     // post id whose reply box is open
  var editingDaily = null;  // date key being edited
  var readOnly = false;
  var canSave = true;
  var saving = false;
  var dirty = false;
  var saveTimer = null;
  var api = null;
  var apiPromise = null;
  var assetsPromise = null;
  var pending = [];         // files picked but not sent yet
  var sending = false;

  /* ---------- storage helpers (never throw) ---------- */
  function lsGet(key) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function ssGet(key) {
    try { var v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function ssSet(key, val) {
    try {
      if (val === null || val === undefined) sessionStorage.removeItem(key);
      else sessionStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- state shape ---------- */
  function normalize(raw) {
    var s = { v: 1, updatedAt: 0, posts: [], daily: [], deleted: [], deletedReplies: [] };
    if (!raw || typeof raw !== "object") return s;
    s.updatedAt = Number(raw.updatedAt) || 0;

    if (Array.isArray(raw.posts)) {
      raw.posts.forEach(function (p) {
        if (!p || !p.id || typeof p.text !== "string") return;
        var replies = [];
        if (Array.isArray(p.replies)) {
          p.replies.forEach(function (r) {
            if (!r || !r.id || typeof r.text !== "string") return;
            replies.push({
              id: String(r.id),
              text: r.text,
              by: toMemberId(r.by || r.from),
              at: Number(r.at) || 0
            });
          });
        }
        replies.sort(function (a, b) { return a.at - b.at; });
        var files = [];
        if (Array.isArray(p.files)) {
          p.files.forEach(function (f) {
            if (!f || !f.id) return;
            files.push({
              id: String(f.id),
              type: String(f.type || "image/jpeg"),
              name: String(f.name || "")
            });
          });
        }
        s.posts.push({
          id: String(p.id),
          text: p.text,
          by: toMemberId(p.by || p.from),
          createdAt: Number(p.createdAt) || 0,
          updatedAt: Number(p.updatedAt) || Number(p.createdAt) || 0,
          ack: Number(p.ack) || 0,
          ackBy: p.ackBy ? toMemberId(p.ackBy) : "",
          files: files,
          replies: replies
        });
      });
    }

    if (Array.isArray(raw.daily)) {
      raw.daily.forEach(function (d) {
        if (!d || typeof d.date !== "string" || typeof d.text !== "string") return;
        s.daily.push({ date: d.date, text: d.text, updatedAt: Number(d.updatedAt) || 0 });
      });
    }

    [["deleted", "deleted"], ["deletedReplies", "deletedReplies"]].forEach(function (pair) {
      var src = raw[pair[0]];
      if (!Array.isArray(src)) return;
      src.forEach(function (d) {
        if (d && d.id) s[pair[1]].push({ id: String(d.id), at: Number(d.at) || 0 });
      });
    });
    return s;
  }

  /* Two phones can write at once, and a save reloads every open view, so a
     device that lost the race folds its own copy back in on the way in. */
  function merge(a, b) {
    a = normalize(a); b = normalize(b);
    var cutoff = Date.now() - TOMBSTONE_MS;

    var tombs = {};
    a.deleted.concat(b.deleted).forEach(function (d) {
      if (!tombs[d.id] || d.at > tombs[d.id].at) tombs[d.id] = d;
    });
    var replyTombs = {};
    a.deletedReplies.concat(b.deletedReplies).forEach(function (d) {
      if (!replyTombs[d.id] || d.at > replyTombs[d.id].at) replyTombs[d.id] = d;
    });

    var byId = {};
    a.posts.concat(b.posts).forEach(function (p) {
      var prev = byId[p.id];
      if (!prev) { byId[p.id] = p; return; }
      var win = p.updatedAt > prev.updatedAt ? p : prev;
      var lose = win === p ? prev : p;
      // a confirmation is never taken back, so the earlier one still counts
      var ackWin = (lose.ack && (!win.ack || lose.ack < win.ack)) ? lose : win;
      byId[p.id] = {
        id: win.id,
        text: win.text,
        by: win.by,
        createdAt: win.createdAt,
        updatedAt: win.updatedAt,
        ack: ackWin.ack,
        ackBy: ackWin.ackBy,
        // attachments are fixed when the report is sent, so the winner's list stands
        files: win.files.length ? win.files : lose.files,
        replies: unionReplies(win.replies, lose.replies)
      };
    });

    var posts = [];
    Object.keys(byId).forEach(function (id) {
      var p = byId[id];
      if (tombs[id] && tombs[id].at >= p.updatedAt) return;
      // a reply the other copy still carries stays deleted
      p.replies = p.replies.filter(function (r) { return !replyTombs[r.id]; });
      posts.push(p);
    });
    posts.sort(function (x, y) { return x.createdAt - y.createdAt; });

    var byDate = {};
    a.daily.concat(b.daily).forEach(function (d) {
      var prev = byDate[d.date];
      if (!prev || d.updatedAt > prev.updatedAt) byDate[d.date] = d;
    });
    var daily = Object.keys(byDate).map(function (k) { return byDate[k]; });

    var deleted = [];
    Object.keys(tombs).forEach(function (id) {
      if (tombs[id].at >= cutoff) deleted.push(tombs[id]);
    });
    var deletedReplies = [];
    Object.keys(replyTombs).forEach(function (id) {
      if (replyTombs[id].at >= cutoff) deletedReplies.push(replyTombs[id]);
    });

    return {
      v: 1,
      updatedAt: Math.max(a.updatedAt, b.updatedAt),
      posts: posts,
      daily: daily,
      deleted: deleted,
      deletedReplies: deletedReplies
    };
  }

  function unionReplies(x, y) {
    var byId = {};
    x.concat(y).forEach(function (r) { if (!byId[r.id]) byId[r.id] = r; });
    return Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return a.at - b.at; });
  }

  /* ---------- status model ---------- */
  function mySide() { return me ? member(me).side : null; }

  /* Who is expected to confirm this post — the other side of the desk. */
  function waitingOn(p) {
    return sideOf(p.by) === "reception" ? "院長" : "受付";
  }

  function statusOf(p) {
    if (p.ack) {
      var name = p.ackBy ? member(p.ackBy).name : waitingOn(p);
      return { label: "✓ " + name + " 確認済み", kind: "fresh" };
    }
    return { label: waitingOn(p) + " 未確認", kind: "wait" };
  }

  function unconfirmed(p) { return !p.ack; }

  /* Can the person looking at this be the one to confirm it? */
  function canAck(p) {
    return !!me && !p.ack && sideOf(p.by) !== mySide();
  }

  /* Does this post wait on the person looking at it right now?
     A question from the receptionist is settled by the director answering it;
     an instruction from the director is settled by the work being done, so it
     stays on the receptionist's list until someone marks it 完了. */

  /* ---------- saving ---------- */
  function getApi() {
    if (apiPromise) return apiPromise;
    if (!window.claude || typeof window.claude.use !== "function") {
      apiPromise = Promise.resolve(null);
      return apiPromise;
    }
    apiPromise = window.claude.use("artifact").then(function (ns) {
      api = ns || null;
      return api;
    }, function () { return null; });
    return apiPromise;
  }

  function getAssets() {
    if (assetsPromise) return assetsPromise;
    if (!window.claude || typeof window.claude.use !== "function") {
      assetsPromise = Promise.resolve(null);
      return assetsPromise;
    }
    assetsPromise = window.claude.use("assets").then(function (ns) {
      return ns || null;
    }, function () { return null; });
    return assetsPromise;
  }

  function setStatus(kind, text) {
    document.getElementById("status").setAttribute("data-state", kind);
    document.getElementById("status-text").textContent = text;
  }

  function scheduleSave() {
    dirty = true;
    lsSet(LS_STATE, state);
    if (!canSave) { setStatus("local", "この端末のみ"); return; }
    setStatus("saving", "保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1400);
  }

  function stateJson() {
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  /* Saving rewrites this page's own stored source with the new state block
     and publishes it. Every open view reloads to it, which is how the other
     person's screen gets the new report. */
  function save() {
    if (saving || !dirty) return;
    getApi().then(function (ns) {
      if (!ns) {
        canSave = false;
        setStatus("local", "この端末のみ");
        return;
      }
      saving = true;
      dirty = false;
      state.updatedAt = Date.now();
      lsSet(LS_STATE, state);

      var OPEN = "<" + 'script id="app-state" type="application/json">';
      var CLOSE = "<" + "/script>";
      fetch(location.pathname, { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (src) {
          var i = src.indexOf(OPEN);
          var j = i < 0 ? -1 : src.indexOf(CLOSE, i);
          if (i < 0 || j < 0 || !/^\s*<!doctype/i.test(src)) {
            throw { code: "page_unreadable", message: "保存先が見つかりません" };
          }
          return ns.publish(src.slice(0, i + OPEN.length) + stateJson() + src.slice(j));
        })
        .then(function () {
          saving = false;
          setStatus("saved", "保存済み");
          if (dirty) scheduleSave();
        }, function (err) {
          saving = false;
          dirty = true;
          handleSaveError(err);
        });
    });
  }

  function handleSaveError(err) {
    var code = (err && err.code) || "upstream_error";
    if (code === "conflict") {
      // The other side saved first; this view is already reloading to their
      // version and folds this copy back in from localStorage on the way.
      setStatus("saving", "更新中…");
      return;
    }
    if (code === "not_writer" || code === "not_granted" ||
        code === "consent_required" || code === "not_declared") {
      canSave = false;
      readOnly = true;
      setStatus("local", "閲覧のみ");
      render();
      return;
    }
    if (code === "rate_limited") {
      setStatus("saving", "保存中…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 5000);
      return;
    }
    setStatus("error", "保存できません");
    showRetryBanner();
  }

  function showRetryBanner() {
    var slot = document.getElementById("banner-slot");
    if (slot.querySelector(".banner")) return;
    var b = document.createElement("div");
    b.className = "banner";
    var msg = document.createElement("span");
    msg.textContent = "送れませんでした。内容はこの端末に残っています。";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "再試行";
    btn.addEventListener("click", function () {
      slot.innerHTML = "";
      setStatus("saving", "保存中…");
      save();
    });
    b.appendChild(msg);
    b.appendChild(btn);
    slot.appendChild(b);
  }

  /* ---------- actions ---------- */
  function findPost(id) {
    var found = null;
    state.posts.forEach(function (p) { if (p.id === id) found = p; });
    return found;
  }

  function addPost(text, files) {
    var now = Date.now();
    state.posts.push({
      id: newId(),
      text: text,
      by: me,
      createdAt: now,
      updatedAt: now,
      ack: 0,
      ackBy: "",
      files: files || [],
      replies: []
    });
    render();
    scheduleSave();
  }

  function addReply(id, text) {
    var p = findPost(id);
    if (!p) return;
    var now = Date.now();
    p.replies.push({ id: newId(), text: text, by: me, at: now });
    p.updatedAt = now;
    // answering the other side is also confirming you saw it
    if (sideOf(p.by) !== mySide() && !p.ack) { p.ack = now; p.ackBy = me; }
    render();
    scheduleSave();
  }

  function ackPost(id) {
    var p = findPost(id);
    if (!p || p.ack) return;
    p.ack = Date.now();
    p.ackBy = me;
    p.updatedAt = p.ack;
    render();
    scheduleSave();
  }

  function deleteReply(postId, replyId) {
    var p = findPost(postId);
    if (!p) return;
    var keep = p.replies.filter(function (r) { return r.id !== replyId; });
    if (keep.length === p.replies.length) return;
    p.replies = keep;
    p.updatedAt = Date.now();
    state.deletedReplies.push({ id: replyId, at: Date.now() });
    render();
    scheduleSave();
  }

  function deletePost(id) {
    var gone = null;
    var keep = [];
    state.posts.forEach(function (p) {
      if (p.id === id) gone = p; else keep.push(p);
    });
    if (!gone) return;
    state.posts = keep;
    state.deleted.push({ id: id, at: Date.now() });
    render();
    scheduleSave();

    // the report is going for good, so its photos go with it
    if (gone.files.length) {
      getAssets().then(function (ns) {
        if (!ns) return;
        gone.files.forEach(function (f) {
          ns.delete(f.id).catch(function () {});
        });
      });
    }
  }

  /* An emptied summary keeps its row with a fresh timestamp, so the deletion
     wins the merge against a device that still holds the old text. */
  function setDaily(date, text) {
    var hit = null;
    state.daily.forEach(function (d) { if (d.date === date) hit = d; });
    var body = text.trim() ? text : "";
    if (hit) {
      hit.text = body;
      hit.updatedAt = Date.now();
    } else if (body) {
      state.daily.push({ date: date, text: body, updatedAt: Date.now() });
    }
    render();
    scheduleSave();
  }

  function dailyOf(date) {
    var hit = null;
    state.daily.forEach(function (d) { if (d.date === date && d.text) hit = d; });
    return hit;
  }

  /* ---------- dates ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function dayLabel(key) {
    var parts = key.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var today = new Date();
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var diff = Math.round((t0 - d) / 86400000);
    var base = (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WEEK[d.getDay()] + ")";
    if (diff === 0) return "今日 " + base;
    if (diff === 1) return "昨日 " + base;
    return base;
  }

  function shortDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WEEK[d.getDay()] + ")";
  }

  /* ---------- rendering ---------- */
  function icon(path, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) +
           '" stroke-linecap="round" stroke-linejoin="round">' + path + "</svg>";
  }

  function button(cls, label, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  /* Deleting takes two taps: the first one arms the button and says so, and it
     disarms itself if nobody follows through. */
  function confirmButton(cls, label, armedLabel, onConfirm) {
    var timer = null;
    var b = button(cls, label, function () {
      if (b.classList.contains("confirm")) {
        clearTimeout(timer);
        onConfirm();
        return;
      }
      b.classList.add("confirm");
      b.textContent = armedLabel;
      timer = setTimeout(function () {
        b.classList.remove("confirm");
        b.textContent = label;
      }, 3000);
    });
    return b;
  }

  function blobUrl(id) { return "_blob/" + id; }
  function isImage(type) { return /^image\//.test(type || ""); }

  var DOC_ICON = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>' +
                 '<path d="M14 2v6h6"></path>';

  function openLightbox(src) {
    var box = document.createElement("div");
    box.className = "lightbox";
    var im = document.createElement("img");
    im.src = src;
    im.alt = "";
    box.appendChild(im);
    function close() {
      box.remove();
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    box.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.getElementById("app").appendChild(box);
  }

  function filesEl(p) {
    var wrap = document.createElement("div");
    wrap.className = "files";
    p.files.forEach(function (f) {
      if (isImage(f.type)) {
        var im = document.createElement("img");
        im.className = "shot";
        im.src = blobUrl(f.id);
        im.alt = f.name || "添付の写真";
        im.loading = "lazy";
        im.addEventListener("click", function () { openLightbox(blobUrl(f.id)); });
        wrap.appendChild(im);
      } else {
        var a = document.createElement("a");
        a.className = "doc";
        a.href = blobUrl(f.id);
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = icon(DOC_ICON, 1.9);
        var sp = document.createElement("span");
        sp.textContent = f.name || (f.type.indexOf("pdf") >= 0 ? "PDF" : "ファイル");
        a.appendChild(sp);
        wrap.appendChild(a);
      }
    });
    return wrap;
  }

  function renderTabs() {
    var box = document.getElementById("tabs");
    box.innerHTML = "";
    var open = state.posts.filter(unconfirmed).length;
    var defs = [
      { id: "open", label: "未確認", n: open },
      { id: "all", label: "すべて", n: null },
      { id: "today", label: "今日", n: null }
    ];
    defs.forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (d.id === "open" && open ? " hot" : "");
      b.setAttribute("aria-pressed", tab === d.id ? "true" : "false");
      var t = document.createElement("span");
      t.textContent = d.label;
      b.appendChild(t);
      if (d.n !== null) {
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = d.n;
        b.appendChild(n);
      }
      b.addEventListener("click", function () { tab = d.id; savePrefs(); render(); });
      box.appendChild(b);
    });
  }

  function postEl(p) {
    var st = statusOf(p);
    var card = document.createElement("article");
    card.className = "post " + member(p.by).cls;

    var head = document.createElement("div");
    head.className = "phead";
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = member(p.by).name;
    var when = document.createElement("span");
    when.className = "when";
    when.textContent = shortDate(p.createdAt);
    head.appendChild(who);
    head.appendChild(when);
    card.appendChild(head);

    if (p.text) {
      var text = document.createElement("p");
      text.className = "ptext";
      text.textContent = p.text;
      card.appendChild(text);
    }

    if (p.files.length) card.appendChild(filesEl(p));

    var pills = document.createElement("div");
    pills.className = "pills";
    var sp = document.createElement("span");
    sp.className = "pill " + st.kind;
    sp.textContent = st.label;
    pills.appendChild(sp);
    card.appendChild(pills);

    if (p.replies.length) {
      var rs = document.createElement("div");
      rs.className = "replies";
      p.replies.forEach(function (r) {
        var rb = document.createElement("div");
        rb.className = "reply " + member(r.by).cls;
        var rh = document.createElement("div");
        rh.className = "rhead";
        var rw = document.createElement("span");
        rw.className = "who";
        rw.textContent = member(r.by).name;
        var rt = document.createElement("span");
        rt.className = "when";
        rt.textContent = shortDate(r.at);
        rh.appendChild(rw);
        rh.appendChild(rt);
        if (!readOnly && r.by === me) {
          rh.appendChild(confirmButton("rdel", "削除", "もう一度", function () {
            deleteReply(p.id, r.id);
          }));
        }
        var rtx = document.createElement("p");
        rtx.className = "rtext";
        rtx.textContent = r.text;
        rb.appendChild(rh);
        rb.appendChild(rtx);
        rs.appendChild(rb);
      });
      card.appendChild(rs);
    }

    if (readOnly || !me) return card;

    if (openReply === p.id) {
      card.appendChild(replyBox(p));
      return card;
    }

    var acts = document.createElement("div");
    acts.className = "actions";

    if (canAck(p)) {
      acts.appendChild(button("act primary", "確認しました", function () { ackPost(p.id); }));
    }
    acts.appendChild(button("act", sideOf(p.by) === mySide() ? "返信" : "ひとこと返す", function () {
      openReply = p.id;
      ssSet(SS_REPLY, { id: p.id, text: "" });
      render();
    }));

    if (p.by === me) {
      acts.appendChild(confirmButton("act ghost", "削除", "もう一度で削除", function () {
        deletePost(p.id);
      }));
    }

    card.appendChild(acts);
    return card;
  }

  function replyBox(p) {
    var wrap = document.createElement("div");
    wrap.className = "replybox";
    var ta = document.createElement("textarea");
    ta.setAttribute("aria-label", "返信を入力");
    ta.placeholder = mySide() === "director" ? "返事・指示を入力…" : "返信を入力…";
    var stash = ssGet(SS_REPLY);
    if (stash && stash.id === p.id) ta.value = stash.text || "";
    ta.addEventListener("input", function () {
      ssSet(SS_REPLY, { id: p.id, text: ta.value });
    });

    var row = document.createElement("div");
    row.className = "row";
    var sendBtn = button("act primary", "送る", function () {
      var t = ta.value.trim();
      if (!t) return;
      openReply = null;
      ssSet(SS_REPLY, null);
      addReply(p.id, t);
    });
    var cancel = button("act", "やめる", function () {
      openReply = null;
      ssSet(SS_REPLY, null);
      render();
    });
    row.appendChild(sendBtn);
    row.appendChild(cancel);

    wrap.appendChild(ta);
    wrap.appendChild(row);
    setTimeout(function () { ta.focus(); }, 0);
    return wrap;
  }

  function dailyEl(key) {
    var rec = dailyOf(key);
    var isToday = key === dayKey(Date.now());

    if (editingDaily === key) {
      var box = document.createElement("div");
      box.className = "daily filled";
      var lab = document.createElement("div");
      lab.className = "dlabel";
      lab.textContent = "この日のまとめ";
      var ta = document.createElement("textarea");
      ta.setAttribute("aria-label", "この日のまとめ");
      ta.placeholder = "来院数、気づいたこと、引き継ぎなど";
      ta.value = rec ? rec.text : "";
      ta.style.cssText = "width:100%;resize:none;font-family:inherit;font-size:15px;line-height:1.55;" +
        "color:var(--ink);background:var(--ground);border:1px solid var(--line);" +
        "border-radius:11px;padding:9px 12px;min-height:84px;margin-top:6px";
      var row = document.createElement("div");
      row.className = "row";
      row.style.cssText = "display:flex;gap:7px;margin-top:8px";
      row.appendChild(button("act primary", "保存", function () {
        editingDaily = null;
        setDaily(key, ta.value);
      }));
      row.appendChild(button("act", "やめる", function () {
        editingDaily = null;
        render();
      }));
      box.appendChild(lab);
      box.appendChild(ta);
      box.appendChild(row);
      setTimeout(function () { ta.focus(); }, 0);
      return box;
    }

    if (rec) {
      var filled = document.createElement("div");
      filled.className = "daily filled";
      var l2 = document.createElement("div");
      l2.className = "dlabel";
      l2.textContent = "この日のまとめ";
      var tx = document.createElement("p");
      tx.className = "dtext";
      tx.textContent = rec.text;
      filled.appendChild(l2);
      filled.appendChild(tx);
      if (!readOnly && me) {
        var acts = document.createElement("div");
        acts.className = "actions";
        acts.appendChild(button("act", "書き直す", function () { editingDaily = key; render(); }));
        acts.appendChild(confirmButton("act ghost", "削除", "もう一度で削除", function () {
          setDaily(key, "");
        }));
        filled.appendChild(acts);
      }
      return filled;
    }

    // writing the day's summary is the receptionist's job; the director only
    // sees it once there is something to read
    if (isToday && !readOnly && mySide() === "reception") {
      var add = document.createElement("div");
      add.className = "daily";
      add.appendChild(button("dadd", "＋ 今日のまとめを書く", function () {
        editingDaily = key;
        render();
      }));
      return add;
    }
    return null;
  }

  function render() {
    renderRoleChip();
    renderTabs();

    var feed = document.getElementById("feed");
    feed.innerHTML = "";

    var today = dayKey(Date.now());
    var shown = state.posts.filter(function (p) {
      if (tab === "open") return unconfirmed(p);
      if (tab === "today") return dayKey(p.createdAt) === today;
      return true;
    });

    // today sits at the top, so its summary box goes first even on a day
    // that has no reports yet
    var hasToday = shown.some(function (p) { return dayKey(p.createdAt) === today; });
    if (tab !== "open" && !hasToday) {
      var todayBox = dailyEl(today);
      if (todayBox) {
        feed.appendChild(daypillEl(today));
        feed.appendChild(todayBox);
      }
    }

    if (!shown.length) {
      var e = document.createElement("div");
      e.className = "empty";
      var h = document.createElement("strong");
      var sub = "";
      if (tab === "open") {
        h.textContent = "未確認はありません";
        sub = "送ったものは全部、相手が確認済みです。";
      } else if (tab === "today") {
        h.textContent = "今日の報告はまだありません";
        sub = "下の入力欄からどうぞ。";
      } else if (!state.posts.length) {
        h.textContent = "まだ報告はありません";
        sub = mySide() === "director"
          ? "受付からの報告がここに並びます。"
          : "院長に伝えたいことを、その場で。";
      } else {
        h.textContent = "表示するものがありません";
        sub = "";
      }
      e.appendChild(h);
      e.appendChild(document.createTextNode(sub));
      feed.appendChild(e);
    } else {
      // newest day first, newest post first inside each day
      var groups = {};
      var order = [];
      shown.slice().sort(function (a, b) { return b.createdAt - a.createdAt; })
        .forEach(function (p) {
          var k = dayKey(p.createdAt);
          if (!groups[k]) { groups[k] = []; order.push(k); }
          groups[k].push(p);
        });

      order.forEach(function (k) {
        feed.appendChild(daypillEl(k));
        if (tab !== "open") {
          var d = dailyEl(k);
          if (d) feed.appendChild(d);
        }
        groups[k].forEach(function (p) { feed.appendChild(postEl(p)); });
      });
    }

    var dir = mySide() === "director";
    document.getElementById("compose").style.display = (readOnly || !me) ? "none" : "";
    document.getElementById("input").placeholder = dir ? "指示・連絡を入力…" : "報告を入力…";
    document.getElementById("hint").textContent = readOnly
      ? ""
      : (dir
          ? "「確認しました」を押すと、受付の画面に確認済みと出ます"
          : "送ると院長の未確認に入ります。確認されると表示が変わります");
  }

  function daypillEl(key) {
    var pill = document.createElement("div");
    pill.className = "daypill";
    pill.textContent = dayLabel(key);
    return pill;
  }

  /* ---------- role ---------- */
  function renderRoleChip() {
    var chip = document.getElementById("rolechip");
    chip.className = "rolechip" + (me ? " " + member(me).cls : "");
    document.getElementById("rolename").textContent = me ? member(me).name : "だれ？";
  }

  function openRoleSheet(forced) {
    if (document.querySelector(".scrim")) return;
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    scrim.appendChild(sheet);

    var grip = document.createElement("div");
    grip.className = "grip";
    sheet.appendChild(grip);

    var h2 = document.createElement("h2");
    h2.textContent = forced ? "この端末はどなたですか？" : "使う人を切り替える";
    var p = document.createElement("p");
    p.textContent = "選んだ名前で報告が残ります。この端末だけの設定なので、一度選べば次からは聞かれません。";
    sheet.appendChild(h2);
    sheet.appendChild(p);

    var pick = document.createElement("div");
    pick.className = "rolepick";
    MEMBERS.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "rolebtn " + o.cls;
      b.setAttribute("aria-pressed", me === o.id ? "true" : "false");
      var mark = document.createElement("span");
      mark.className = "mark";
      mark.innerHTML = icon(TICK, 3.4);
      var txt = document.createElement("span");
      var nm = document.createElement("div");
      nm.className = "rname";
      nm.textContent = o.name;
      var ds = document.createElement("div");
      ds.className = "rdesc";
      ds.textContent = o.desc;
      txt.appendChild(nm);
      txt.appendChild(ds);
      b.appendChild(mark);
      b.appendChild(txt);
      b.addEventListener("click", function () {
        me = o.id;
        savePrefs();
        close();
      });
      pick.appendChild(b);
    });
    sheet.appendChild(pick);

    if (!forced) {
      scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
      document.addEventListener("keydown", onKey);
    }
    document.getElementById("app").appendChild(scrim);

    function onKey(e) { if (e.key === "Escape") close(); }
    function close() {
      document.removeEventListener("keydown", onKey);
      scrim.remove();
      render();
    }
  }

  document.getElementById("rolechip").addEventListener("click", function () {
    openRoleSheet(false);
  });

  /* ---------- compose ---------- */
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var fileInput = document.getElementById("file");
  var clip = document.getElementById("clip");
  var pendingBox = document.getElementById("pending");
  var MAX_FILES = 4;
  var hintTimer = null;

  function flashHint(msg) {
    var h = document.getElementById("hint");
    clearTimeout(hintTimer);
    h.textContent = msg;
    hintTimer = setTimeout(render, 4000);
  }

  function syncEntry() {
    input.style.height = "44px";
    input.style.height = Math.min(input.scrollHeight + 2, 148) + "px";
    send.disabled = sending || !(input.value.trim() || pending.length);
    clip.disabled = sending || pending.length >= MAX_FILES;
    ssSet(SS_DRAFT, input.value);
  }

  function renderPending() {
    pendingBox.innerHTML = "";
    pendingBox.hidden = !pending.length;
    pending.forEach(function (it, i) {
      var cell = document.createElement("div");
      cell.className = "pitem";
      if (isImage(it.type)) {
        var im = document.createElement("img");
        im.src = it.preview;
        im.alt = "";
        cell.appendChild(im);
      } else {
        var d = document.createElement("div");
        d.className = "doc";
        d.textContent = it.type.indexOf("pdf") >= 0 ? "PDF" : "動画";
        cell.appendChild(d);
      }
      var x = document.createElement("button");
      x.type = "button";
      x.className = "x";
      x.textContent = "×";
      x.setAttribute("aria-label", "この添付をやめる");
      x.addEventListener("click", function () {
        if (it.preview) URL.revokeObjectURL(it.preview);
        pending.splice(i, 1);
        renderPending();
        syncEntry();
      });
      cell.appendChild(x);
      pendingBox.appendChild(cell);
    });
  }

  /* Phone photos run 3-5MB each and the artifact's storage is shared, so a
     long edge over 1600px is redrawn smaller before it is uploaded. */
  function shrinkImage(file) {
    return new Promise(function (resolve) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 300 * 1024) {
        resolve(file);
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) {
          resolve(blob && blob.size < file.size ? blob : file);
        }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  clip.addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var picked = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = "";
    if (!picked.length) return;
    var room = MAX_FILES - pending.length;
    if (room <= 0) {
      flashHint("貼れるのは1件につき" + MAX_FILES + "つまでです");
      return;
    }
    picked.slice(0, room).forEach(function (file) {
      shrinkImage(file).then(function (blob) {
        var type = blob.type || file.type;
        pending.push({
          blob: blob,
          type: type,
          name: file.name || "",
          preview: isImage(type) ? URL.createObjectURL(blob) : ""
        });
        renderPending();
        syncEntry();
      });
    });
  });

  function uploadMessage(err) {
    var code = (err && err.code) || "upstream_error";
    if (code === "too_large") return "ファイルが大きすぎます（1つ20MBまで）";
    if (code === "unsupported_type") return "この種類は貼れません。写真・PDF・動画のみです";
    if (code === "quota_or_state") return "保存容量がいっぱいです。古い添付を消してください";
    if (code === "rate_limited") return "続けて貼りすぎです。少し待ってからどうぞ";
    if (code === "not_granted" || code === "capability_disabled") return "この画面では写真を貼れません";
    return "送れませんでした。もう一度お試しください";
  }

  function finishPost(text, files) {
    addPost(text, files);
    input.value = "";
    ssSet(SS_DRAFT, null);
    syncEntry();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function submit() {
    var text = input.value.trim();
    if (sending || !me || (!text && !pending.length)) return;

    if (!pending.length) {
      finishPost(text, []);
      return;
    }

    sending = true;
    syncEntry();
    setStatus("saving", "添付を送っています…");

    getAssets().then(function (ns) {
      if (!ns) {
        sending = false;
        syncEntry();
        setStatus("saved", "保存済み");
        flashHint("この画面では写真を貼れません");
        return;
      }
      var queue = pending.slice();
      var done = [];
      (function step(i) {
        if (i >= queue.length) {
          pending.forEach(function (it) { if (it.preview) URL.revokeObjectURL(it.preview); });
          pending = [];
          renderPending();
          sending = false;
          finishPost(text, done);
          return;
        }
        ns.upload(queue[i].blob, { type: queue[i].type }).then(function (res) {
          done.push({
            id: res.id,
            type: res.contentType || queue[i].type,
            name: queue[i].name
          });
          step(i + 1);
        }, function (err) {
          sending = false;
          syncEntry();
          setStatus("saved", "保存済み");
          flashHint(uploadMessage(err));
        });
      })(0);
    });
  }

  input.addEventListener("input", syncEntry);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing &&
        matchMedia("(pointer: fine)").matches) {
      e.preventDefault();
      submit();
    }
  });
  send.addEventListener("click", submit);

  function savePrefs() {
    lsSet(LS_PREFS, { me: me, tab: tab });
  }

  /* ---------- boot ---------- */
  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("app-state").textContent); } catch (e) {}
  state = merge(embedded, lsGet(LS_STATE));

  var prefs = lsGet(LS_PREFS);
  if (prefs) {
    if (BY_ID[prefs.me]) me = prefs.me;
    if (prefs.tab === "all" || prefs.tab === "open" || prefs.tab === "today") tab = prefs.tab;
  }

  var draft = ssGet(SS_DRAFT);
  if (typeof draft === "string" && draft) input.value = draft;

  // a save reloads every open view, so a half-typed reply comes back with it
  var stashed = ssGet(SS_REPLY);
  if (stashed && stashed.id && findPost(stashed.id)) openReply = stashed.id;

  render();
  syncEntry();

  if (!me) openRoleSheet(true);

  getApi().then(function (ns) {
    if (!ns) { canSave = false; setStatus("local", "この端末のみ"); }
    else setStatus("saved", "保存済み");
  });
})();
</script>
