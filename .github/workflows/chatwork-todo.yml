name: Chatwork TODO

on:
  schedule:
    # 5分おきにマイチャットの新着を確認（GitHub Actions の都合で数分遅れることがあります）
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: chatwork-todo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect from Chatwork
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: python src/chatwork_todo.py

      - name: Commit updates
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "受付TODO: Chatworkからの取り込み"
            git push
          else
            echo "更新なし"
          fi
