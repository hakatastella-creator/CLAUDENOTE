<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月次レポート作成｜博多ステラ歯科</title>
<style>
  :root {
    --green: #1f8a5b; --green-d: #176c47; --amber: #b5761f;
    --line: #d5dce3; --bg: #f4f7f6; --ink: #1f2933; --dim: #7b8794;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; }
  header { background: var(--green); color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .topbar label { font-weight: 600; font-size: 13px; }
  .topbar input[type="text"], .topbar input[type="month"] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
  .topbar input.clinic { flex: 1; min-width: 200px; }
  .legend-bar { font-size: 12px; color: var(--dim); margin: 0 0 12px; display: flex; gap: 12px; flex-wrap: wrap; }

  fieldset { background: #fff; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 8px 14px 14px; }
  legend { font-weight: 700; color: var(--green-d); padding: 0 6px; font-size: 15px; }
  .src { font-size: 11px; color: var(--dim); margin: 2px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 14px; }
  .f { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .f label { font-size: 13px; }
  .f input { width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; text-align: right; }
  .f .unit { font-size: 12px; color: var(--dim); width: 20px; }
  .grid .subhead { grid-column: 1 / -1; font-weight: 600; font-size: 12px; color: var(--green-d); margin: 6px 0 0; padding-bottom: 2px; border-bottom: 1px dashed var(--line); }

  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
  .tag.glance { background: #d8f0e3; color: #176c47; }
  .tag.count { background: #fdecd6; color: #9a5b12; }
  .tag.manual { background: #e6eefb; color: #25508a; }

  .pipe-wrap { overflow-x: auto; }
  .pipe-head, .pipe-row { display: grid; grid-template-columns: minmax(120px, 1.6fr) repeat(5, 54px) 28px; gap: 6px; align-items: center; min-width: 440px; }
  .pipe-head { font-size: 11px; color: var(--dim); font-weight: 600; margin-bottom: 4px; }
  .pipe-head span { text-align: center; }
  .pipe-head .h-name { text-align: left; }
  .pipe-row { margin-bottom: 6px; }
  .pipe-row input[type="text"] { padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px; }
  .pipe-row .chk { text-align: center; }
  .pipe-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .pipe-del { border: none; background: transparent; color: #b44a1e; cursor: pointer; font-size: 14px; }
  #pipe-add { margin-top: 8px; padding: 6px 12px; font-size: 13px; }
  .names-list { font-size: 11px; color: #52514e; line-height: 1.7; word-break: break-word; }

  fieldset.calc { background: #eef7f1; border-color: #cfe7da; }
  fieldset.calc legend { color: var(--green-d); }
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 14px; }
  .calc-grid .f label { font-weight: 600; }
  .calc-grid .cv { font-weight: 700; color: var(--green-d); font-variant-numeric: tabular-nums; }

  .actions { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; background: rgba(244,247,246,.95); padding: 12px 0; margin-top: 6px; }
  button { padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; background: var(--green); }
  button:hover { background: var(--green-d); }
  button.excel { background: var(--amber); flex: 1; min-width: 220px; }
  button.excel:hover { background: #955f16; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { background: #eef1f4; }
  .status { font-size: 13px; min-height: 18px; padding: 4px 2px; }
  .status.ok { color: var(--green-d); }
  .status.err { color: #b44a1e; }
  .note { font-size: 12px; color: var(--dim); margin-top: 4px; }

  /* ===== レポート表示（表・グラフ・印刷/PDF） ===== */
  #report { display: none; }
  #report.show { display: block; position: fixed; inset: 0; z-index: 9999; background: #eceff1; overflow: auto; }
  .rep-toolbar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; background: rgba(236,239,241,.96); border-bottom: 1px solid var(--line); }
  .report-page { background: #fff; max-width: 820px; margin: 16px auto; padding: 28px 32px; box-shadow: 0 4px 24px rgba(0,0,0,.12); color: var(--ink); --series: #2a78d6; --ink2: #52514e; --muted: #898781; --axis: #c3c2b7; }
  .rep-header { border-bottom: 3px solid var(--green); padding-bottom: 10px; margin-bottom: 16px; }
  .rep-header .clinic { font-size: 13px; color: var(--ink2); }
  .rep-header .title { font-size: 22px; font-weight: 800; margin: 2px 0; }
  .rep-header .month { font-size: 15px; color: var(--green-d); font-weight: 700; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .kpi-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--series); background: #fbfdff; }
  .kpi-card .k-label { font-size: 11px; color: var(--ink2); }
  .kpi-card .k-value { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .kpi-card .k-sub { font-size: 10px; color: var(--muted); }
  .rep-section { margin: 0 0 18px; break-inside: avoid; }
  .rep-section > h3 { font-size: 14px; font-weight: 700; color: var(--green-d); border-left: 4px solid var(--green); padding-left: 8px; margin: 0 0 8px; }
  .rep-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  table.rep { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rep th, table.rep td { border: 1px solid var(--line); padding: 4px 8px; }
  table.rep th { background: #eef4fb; text-align: left; font-weight: 600; color: var(--ink2); white-space: nowrap; }
  table.rep td { text-align: right; font-variant-numeric: tabular-nums; }
  table.rep th.lab { font-weight: 600; }
  table.rep tr.total th, table.rep tr.total td { background: #f2f7f4; font-weight: 700; }
  table.rep tr.rep-spacer td { border: none; height: 8px; padding: 0; background: #fff; }
  table.rep tr.sub th, table.rep tr.sub td { background: #f7fafc; font-weight: 600; }
  .tbl-title { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
  .chart .c-title { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .chart-svg { width: 100%; height: auto; }
  .c-lab { fill: var(--ink2); font-size: 11px; }
  .c-val { fill: var(--ink); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .c-bar { fill: var(--series); }
  .c-axis { stroke: var(--axis); stroke-width: 1; }
  .chart .empty { font-size: 11px; color: var(--muted); padding: 8px 0; }
  .rep-foot { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10px; color: var(--muted); }
  @media (max-width: 620px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .rep-cols { grid-template-columns: 1fr; } }
  @media print {
    header, .topbar, .legend-bar, #f, .actions, .status, .wrap > .note { display: none !important; }
    #report.show { position: static; background: #fff; overflow: visible; }
    .rep-toolbar { display: none !important; }
    .report-page { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    .rep-section { break-inside: avoid; }
    @page { size: A4; margin: 14mm; }
  }
</style>
</head>
<body>
<header>
  <h1>🗓 月次レポート作成システム</h1>
  <div class="sub">アポツールの画面を見ながら数字を入力 → 月次レポートを作成（受付向け）</div>
</header>

<div class="wrap">
  <div class="topbar">
    <label>医院名</label>
    <input type="text" class="clinic" id="clinic_name" value="博多ステラ歯科・矯正歯科クリニック" />
    <label>対象月</label>
    <input type="month" id="month" />
  </div>
  <div class="legend-bar">
    <span><span class="tag glance">一目</span> 画面の集計値を転記</span>
    <span><span class="tag count">要カウント</span> イベント登録が無ければ数える</span>
    <span><span class="tag manual">手入力</span> 会計・レセコンから</span>
  </div>

  <form id="f" autocomplete="off"></form>

  <div class="actions">
    <button type="button" class="excel" id="btn-report">🖨 レポートを表示（表・グラフ／印刷・PDF）</button>
    <button type="button" id="btn-excel">📊 Excelを作成</button>
    <button type="button" class="ghost" id="btn-save">💾 一時保存</button>
    <button type="button" class="ghost" id="btn-copy-prev">📂 先月を複製</button>
    <button type="button" class="ghost" id="btn-clear">🗑 クリア</button>
  </div>
  <div class="status" id="status"></div>
  <div class="note">入力内容はこのブラウザ内（この端末）に対象月ごとに保存されます。外部には送信されません。</div>
</div>

<div id="report" aria-hidden="true">
  <div class="rep-toolbar">
    <button type="button" id="btn-print">🖨 印刷 / PDFで保存</button>
    <button type="button" class="ghost" id="btn-report-close">← 入力に戻る</button>
  </div>
  <div class="report-page"></div>
</div>

<script>
/* ============================================================
 * xlsx 生成エンジン（外部ライブラリ不要）
 * ============================================================ */
(function () {
  "use strict";
  const enc = new TextEncoder();
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  function zip(files) {
    const chunks = [], central = []; let offset = 0;
    for (const f of files) {
      const nb = enc.encode(f.name), data = f.data, crc = crc32(data);
      const lh = new Uint8Array(30 + nb.length), dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true); dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true); dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true); lh.set(nb, 30);
      chunks.push(lh, data);
      const cd = new Uint8Array(46 + nb.length), cdv = new DataView(cd.buffer);
      cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true); cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true); cdv.setUint16(12, 0, true); cdv.setUint16(14, 0x21, true); cdv.setUint32(16, crc, true);
      cdv.setUint32(20, data.length, true); cdv.setUint32(24, data.length, true); cdv.setUint16(28, nb.length, true);
      cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true); cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true); cdv.setUint32(42, offset, true); cd.set(nb, 46);
      central.push(cd); offset += lh.length + data.length;
    }
    const cdStart = offset; let cdSize = 0; for (const c of central) { chunks.push(c); cdSize += c.length; }
    const eo = new Uint8Array(22), edv = new DataView(eo.buffer);
    edv.setUint32(0, 0x06054b50, true); edv.setUint16(4, 0, true); edv.setUint16(6, 0, true);
    edv.setUint16(8, central.length, true); edv.setUint16(10, central.length, true);
    edv.setUint32(12, cdSize, true); edv.setUint32(16, cdStart, true); edv.setUint16(20, 0, true); chunks.push(eo);
    let total = 0; for (const c of chunks) total += c.length;
    const out = new Uint8Array(total); let p = 0; for (const c of chunks) { out.set(c, p); p += c.length; } return out;
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function colName(n) { let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function cell(r, ci, c) {
    const ref = colName(ci) + r; let v = c, b = false; if (c && typeof c === "object") { v = c.v; b = !!c.bold; }
    const s = b ? ' s="1"' : "";
    if (v === null || v === undefined || v === "") return `<c r="${ref}"${s}/>`;
    if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  }
  const CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const WBR = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const STY = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  function wbx(name) { return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + esc(name).slice(0, 31) + '" sheetId="1" r:id="rId1"/></sheets></workbook>'; }
  function sheet(rows) {
    let sd = ""; rows.forEach((row, i) => { const r = i + 1; let cs = ""; (row || []).forEach((c, ci) => cs += cell(r, ci, c)); sd += `<row r="${r}">${cs}</row>`; });
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="40" customWidth="1"/><col min="2" max="2" width="16" customWidth="1"/></cols><sheetData>' + sd + '</sheetData></worksheet>';
  }
  window.__xlsx = function (name, rows) {
    return zip([
      { name: "[Content_Types].xml", data: enc.encode(CT) },
      { name: "_rels/.rels", data: enc.encode(RELS) },
      { name: "xl/workbook.xml", data: enc.encode(wbx(name)) },
      { name: "xl/_rels/workbook.xml.rels", data: enc.encode(WBR) },
      { name: "xl/styles.xml", data: enc.encode(STY) },
      { name: "xl/worksheets/sheet1.xml", data: enc.encode(sheet(rows)) },
    ]);
  };
})();

  const pctS = (v) => (v == null ? "—" : v + "%");
  const escX = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const STAGES = ["kensa", "yoyaku", "setsumei", "shiharai", "kaishi"];

  // 矯正パイプライン（患者ごとのステージ管理）
  function addPipeRow(d) {
    d = d || {};
    const row = document.createElement("div");
    row.className = "pipe-row";
    row.innerHTML = `<input type="text" class="p-name" placeholder="氏名" />` +
      STAGES.map((s) => `<span class="chk"><input type="checkbox" class="p-${s}" /></span>`).join("") +
      `<button type="button" class="pipe-del" title="削除">✕</button>`;
    row.querySelector(".p-name").value = d.name || "";
    STAGES.forEach((s) => { if (d[s]) row.querySelector(".p-" + s).checked = true; });
    row.querySelector(".pipe-del").addEventListener("click", () => { row.remove(); recompute(); });
    document.getElementById("pipe-rows").appendChild(row);
  }
  function readPipeline() {
    const out = [];
    document.querySelectorAll("#pipe-rows .pipe-row").forEach((row) => {
      const name = row.querySelector(".p-name").value.trim();
      const o = { name }; let any = !!name;
      STAGES.forEach((s) => { o[s] = row.querySelector(".p-" + s).checked; if (o[s]) any = true; });
      if (any) out.push(o);
    });
    return out;
  }
  function setPipeline(arr) {
    const host = document.getElementById("pipe-rows");
    if (!host) return;
    host.innerHTML = "";
    (arr && arr.length ? arr : [{}]).forEach((d) => addPipeRow(d));
  }

  function nowMonth() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function monthLabel(ym) { const [y, m] = (ym || "").split("-"); return y && m ? `${y}年${Number(m)}月` : ym; }
  function setStatus(m, t) { statusEl.textContent = m || ""; statusEl.className = "status " + (t || ""); }

  // ---- フォーム生成 ----
  const form = $("f");
  SECTIONS.forEach((sec, i) => {
    const fs = document.createElement("fieldset");
    const srcLine = (sec.type === "pipeline" ? "" : "アポツール：") + sec.src + (sec.note ? `（${sec.note}）` : "");
    const legend = `<legend>${i + 1}. ${sec.title}<span class="tag ${sec.tag}">${TAGN[sec.tag]}</span></legend><div class="src">${srcLine}</div>`;
    if (sec.type === "pipeline") {
      fs.innerHTML = legend +
        `<div class="pipe-wrap"><div class="pipe-head"><span class="h-name">氏名</span><span>検査</span><span>説明予約</span><span>説明</span><span>支払</span><span>開始</span><span></span></div><div id="pipe-rows"></div></div>` +
        `<button type="button" class="ghost" id="pipe-add">＋ 患者を追加</button>`;
    } else {
      const fields = sec.fields.map((f) => {
        if (f.head) return `<div class="subhead">${f.head}</div>`;
        const step = f.unit === "%" ? ' step="0.1"' : "";
        return `<div class="f"><label>${f.label}</label><input type="number"${step} id="${f.id}" /><span class="unit">${f.unit}</span></div>`;

  const calcFs = document.createElement("fieldset");
  calcFs.className = "calc";
  calcFs.innerHTML = `<legend>自動計算（確認用）</legend><div class="calc-grid" id="calc"></div>`;
  form.appendChild(calcFs);

  // ---- 計算 ----
  function computed() {
    const cancel = num("c_jizen") + num("c_touji") + num("c_muidan");
    const kyoseiUri = num("uk_full") + num("uk_mod") + num("uk_light");
    const biyoUri = num("ub_hifu") + num("ub_white");
    const jihiUri = num("uj_inlay") + num("uj_crown") + num("uj_botox") + num("uj_db") + num("uj_laminate") + num("uj_other");
    const jihiSougaku = kyoseiUri + biyoUri + jihiUri + num("u_cancel");
    const uriTotal = num("u_hoken") + jihiSougaku + num("u_zatsu");
    const pipe = readPipeline();
    const pc = (s) => pipe.filter((p) => p[s]).length;
    return {
      cancel, uriTotal, jihiSougaku, kyoseiUri, biyoUri, jihiUri, pipe,
      cancelRate: rate(cancel, num("d_yoyaku")),
      jihiRate: rate(num("j_jihi"), num("j_jihi") + num("j_hoken")),
      recallGet: rate(num("r_yoyaku"), num("r_taisho")),

  }
  function recompute() {

      ["合計売上高", yen(c.uriTotal)], ["自費総額", yen(c.jihiSougaku)],

      ["キャンセル件数合計", nf(c.cancel) + " 件"], ["キャンセル率", pctS(c.cancelRate)],
      ["自費率", pctS(c.jihiRate)], ["定期検診 予約取得率", pctS(c.recallGet)], ["定期検診 来院率", pctS(c.recallVisit)],

  function save(silent) { localStorage.setItem(KEY + monthEl.value, JSON.stringify(collect())); if (!silent) setStatus("保存しました（" + monthLabel(monthEl.value) + "）", "ok"); }
  function load(ym) { const raw = localStorage.getItem(KEY + ym); if (raw) { try { apply(JSON.parse(raw)); return true; } catch (e) {} } return false; }

  // ---- グラフ ----
  function barsH(rows, o) {
    o = o || {}; const W = o.w || 440, rh = o.rh || 26, Lw = o.labelW || 96, Rw = o.valueW || 60;
    const Bw = Math.max(40, W - Lw - Rw), max = Math.max(1, ...rows.map((r) => r.value));
    if (max <= 0 || !rows.length) return '<div class="empty">データがありません</div>';
    const H = rows.length * rh + 6; let s = "";
    rows.forEach((r, i) => {
      const y = i * rh + 3, cy = y + rh / 2, len = Math.max(2, (r.value / max) * Bw);
      const disp = r.display != null ? r.display : nf(r.value);
      s += `<text x="${Lw - 6}" y="${cy}" text-anchor="end" dominant-baseline="central" class="c-lab">${escX(r.label)}</text>`;
      s += `<rect x="${Lw}" y="${y + 3}" width="${len}" height="${rh - 10}" rx="4" class="c-bar"><title>${escX(r.label)}: ${escX(disp)}</title></rect>`;
      s += `<text x="${Lw + len + 6}" y="${cy}" dominant-baseline="central" class="c-val">${escX(disp)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMinYMin meet" role="img">${s}</svg>`;
  }
  function barsV(rows, o) {
    o = o || {}; const W = o.w || 380, H = o.h || 170, n = rows.length, bw = o.bw || 40;
    const gap = (W - n * bw) / (n + 1), max = Math.max(1, ...rows.map((r) => r.value));
    const base = H - 22, top = 14, plot = base - top;
    let s = `<line x1="0" y1="${base}" x2="${W}" y2="${base}" class="c-axis"/>`;
    rows.forEach((r, i) => {
      const x = gap + i * (bw + gap), h = Math.max(2, (r.value / max) * plot), y = base - h;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" class="c-bar"><title>${escX(r.label)}: ${nf(r.value)}</title></rect>`;
      s += `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" class="c-val">${nf(r.value)}</text>`;
      s += `<text x="${x + bw / 2}" y="${base + 14}" text-anchor="middle" class="c-lab">${escX(r.label)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMinYMin meet" role="img">${s}</svg>`;
  }

    const rows = [];
    const clinic = $("clinic_name").value || "当院";
    rows.push([{ v: `${clinic}　月次レポート　${monthLabel(monthEl.value)}`, bold: true }]);
    rows.push([]);
    const c = computed();
    SECTIONS.forEach((sec, i) => {
      rows.push([{ v: `■ ${i + 1}. ${sec.title}（${TAGN[sec.tag]}）`, bold: true }]);
      if (sec.type === "pipeline") {
        rows.push([{ v: "氏名", bold: true }, { v: "検査", bold: true }, { v: "説明予約", bold: true }, { v: "説明", bold: true }, { v: "支払", bold: true }, { v: "開始", bold: true }]);
        c.pipe.forEach((p) => rows.push([p.name, p.kensa ? "○" : "", p.yoyaku ? "○" : "", p.setsumei ? "○" : "", p.shiharai ? "○" : "", p.kaishi ? "○" : ""]));
        rows.push([{ v: "人数", bold: true }, c.kensaN, c.yoyakuN, c.setsumeiN, c.shiharaiN, c.kaishiN]);
        rows.push([]);
        return;
      }
      rows.push([{ v: "項目", bold: true }, { v: "値", bold: true }]);
      sec.fields.forEach((f) => {
        if (f.head) { rows.push([{ v: "〔" + f.head + "〕", bold: true }]); return; }
        rows.push([f.label, f.unit === "%" ? (num(f.id) ? num(f.id) + "%" : "—") : num(f.id)]);
      });
      if (sec.title === "売上") {
        rows.push([{ v: "矯正 計", bold: true }, c.kyoseiUri]); rows.push([]);
        rows.push([{ v: "美容 計", bold: true }, c.biyoUri]); rows.push([]);
        rows.push([{ v: "自費 計", bold: true }, c.jihiUri]); rows.push([]);
        rows.push([{ v: "自費総額", bold: true }, c.jihiSougaku]);
        rows.push([{ v: "合計売上高", bold: true }, c.uriTotal]);
      }
      rows.push([]);
    });
    rows.push([{ v: "■ 自動計算", bold: true }]);
    rows.push([{ v: "項目", bold: true }, { v: "値", bold: true }]);
    [["合計売上高", c.uriTotal], ["自費総額", c.jihiSougaku], ["矯正 売上計", c.kyoseiUri], ["美容 売上計", c.biyoUri], ["自費 売上計", c.jihiUri], ["当月キャンセル件数", c.cancel],
     ["キャンセル率", pctS(c.cancelRate)], ["自費率", pctS(c.jihiRate)], ["定期検診 予約取得率", pctS(c.recallGet)],
     ["定期検診 来院率", pctS(c.recallVisit)], ["矯正 検査/説明予約/説明/支払/開始（人）", `${c.kensaN}/${c.yoyakuN}/${c.setsumeiN}/${c.shiharaiN}/${c.kaishiN}`],
     ["目標達成率（予約）", pctS(c.targetYoyaku)], ["Web予約率", pctS(c.webRate)]
    ].forEach((r) => rows.push([r[0], r[1]]));
    rows.push([]); rows.push([{ v: "作成日時：" + new Date().toLocaleString("ja-JP") }]);
    return rows;
  }
  function exportExcel() {
    try {
      const bytes = window.__xlsx("月次レポート", buildRows());
      const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      const clinic = ($("clinic_name").value || "月次").replace(/[\\/:*?"<>|]/g, "");
      a.href = url; a.download = `月次レポート_${monthEl.value}_${clinic}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
      save(true); setStatus("Excelを作成しました（保存済み）", "ok");
    } catch (e) { setStatus("エラー: " + e.message, "err"); }
  }

  function showReport() { save(true); renderReport(); const r = $("report"); r.classList.add("show"); r.setAttribute("aria-hidden", "false"); window.scrollTo(0, 0); }
  function hideReport() { const r = $("report"); r.classList.remove("show"); r.setAttribute("aria-hidden", "true"); }

  // ---- 配線 ----
  form.addEventListener("input", recompute);
  form.addEventListener("change", recompute);
  $("pipe-add").addEventListener("click", () => addPipeRow());
  $("btn-report").addEventListener("click", showReport);
  $("btn-excel").addEventListener("click", exportExcel);
  $("btn-save").addEventListener("click", () => save(false));
  $("btn-report-close").addEventListener("click", hideReport);
  $("btn-print").addEventListener("click", () => window.print());
  $("btn-clear").addEventListener("click", () => {
    if (!confirm(monthLabel(monthEl.value) + " の入力をクリアします。よろしいですか？（保存済みデータは残ります）")) return;
    ALL.forEach((f) => ($(f.id).value = "")); setPipeline([]); recompute(); setStatus("クリアしました", "ok");
  });
  $("btn-copy-prev").addEventListener("click", () => {
    const pm = prevMonth(monthEl.value), raw = localStorage.getItem(KEY + pm);
    if (!raw) { setStatus(monthLabel(pm) + " の保存データがありません", "err"); return; }
    try { const o = JSON.parse(raw); o.__month = monthEl.value; apply(o); setStatus(monthLabel(pm) + " の内容を複製しました（数字を修正してください）", "ok"); }
    catch (e) { setStatus("複製に失敗しました", "err"); }
  });
  monthEl.addEventListener("change", () => { if (!load(monthEl.value)) { ALL.forEach((f) => ($(f.id).value = "")); setPipeline([]); recompute(); } setStatus(""); });

  // ---- 初期化 ----
  monthEl.value = nowMonth();
  if (!load(monthEl.value)) setPipeline([]);
  recompute();
})();
</script>
</body>
</html>
