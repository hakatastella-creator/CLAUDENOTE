<script id="ledger-data" type="application/json">{"updatedAt":0,"entries":[{"category":"other","content":"最初は矯正のカウンセリングで何件か歯科医院を回っていた中で、こちらに伺いました。\n\nカウンセリングの際、他院では指摘されなかった虫歯や歯周病のリスクについても丁寧に説明していただき、「ここなら歯のことを安心してお任せできそう」と感じたことが決め手となり、その後の治療もこちらでお願いすることにしました。\n\n院長先生をはじめ、スタッフの皆さんがいつも丁寧に説明してくださり、こちらの些細な質問にも一つひとつ分かりやすく答えてくださるので、疑問や不安を残すことなく安心して施術を受けることができます。\n受付のスタッフさんもいつも素敵な笑顔で迎えてくださり、気持ちよく通院できています。\n\n親知らずや矯正のための抜歯もお願いしましたが、どの抜歯も驚くほどスムーズで、抜歯後の腫れもほとんど気になりませんでした。\n院長先生に抜歯をお願いして本当に良かったと思っています。\n\nまた、今月からホワイトニングも始めました。\n担当してくださっているスタッフさんも、歯が白くなってきたことを一緒に喜んでくださり、とても嬉しかったです。\n日頃の歯磨きについても、きちんと磨けていると褒めていただけるので、毎日のケアも頑張ろうと思えます。\n\nこれからも月に一度、クリーニングとホワイトニングで通う予定です。\n\n治療や抜歯、予防、ホワイトニングまで、歯のことを安心してお任せできる歯科医院に出会えて本当に良かったです。\n\n書きたいことがたくさんあり、長文になってしまいましたが、それくらい安心して通うことができ、素敵な歯科医院だと感じています。\nこれからもよろしくお願いします。","createdAt":"2026-09-04T02:49:38.275Z","giftLabel":"ホワイトニング3000円オフ","givenDate":"","id":"rmtmcvhlv9zf10","month":"2026-09","name":"久冨千聖","note":"","patientNo":"2717","postedAt":"","reviewer":"","staff":"","stars":5,"status":"pending","updatedAt":"2026-09-04T02:49:38.275Z"},{"category":"ortho","content":"今回、親知らずの抜歯と虫歯の治療でお世話になりました。横向きになっている親知らずの抜歯で不安でしたが、治療について丁寧に説明していただき、不安も解消されました。また、治療時間も短く、痛みもなく、とても良かったです。\n今後も利用させていただきたいと思います！","createdAt":"2026-09-04T03:29:24.380Z","giftLabel":"","givenDate":"","id":"rmtmeamqjk3ufn","month":"2026-09","name":"田代大次郎","note":"","patientNo":"2712","postedAt":"","reviewer":"ああ","staff":"","stars":5,"status":"pending","updatedAt":"2026-09-04T03:29:58.499Z"},{"category":"ortho","content":"友達の紹介で通い始めました！施術も説明もとても丁寧でとても安心できます💡\n受付のスタッフさんにいつも癒されています！ありがとうございます🙂‍↕️","createdAt":"2026-09-04T03:33:24.040Z","giftLabel":"","givenDate":"","id":"rmtmefrnsth70r","month":"2026-09","name":"川口栞菜","note":"","patientNo":"2851","postedAt":"","reviewer":"かんな","staff":"","stars":5,"status":"pending","updatedAt":"2026-09-04T03:33:24.040Z"}],"deleted":[]}</script>

  </section>
</div>

<dialog id="bkDlg">

  </div>
  <div class="body">
    <p>いま表示している口コミ全件のデータです。テキストとして控えておけば、別の端末やブラウザに貼り付けて元に戻せます。</p>

    </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var LS_STATE = "stella-review-gifts/state/v1";
  var TOMBSTONE_MS = 90 * 24 * 60 * 60 * 1000;
  var downloads = null;
  var entries = [], deleted = [];
  var view = { month: thisMonth(), filter: "all", meeting: false };
  var editingId = null;
  var api = null, apiPromise = null;
  var canSave = true, readOnly = false, saving = false, dirty = false, saveTimer = null;

  var $ = function(s){ return document.querySelector(s); };
  var listEl = $("#list"), emptyEl = $("#empty"), statsEl = $("#stats");
  var monthSel = $("#month"), dlg = $("#dlg"), form = $("#form");

  function thisMonth(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function today(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function uid(){
    return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  // 台帳は令和8年9月分から。月は「R8.9月」の形で表示する
  var START_MONTH = "2026-09";
  function eraOf(year){ return Number(year) - 2018; }   // 令和1年 = 2019年
  function monthLabel(m){
    var p = String(m || "").split("-");
    return p.length === 2 ? "R" + eraOf(p[0]) + "." + Number(p[1]) + "月" : String(m || "");
  }
  function monthLabelLong(m){
    var p = String(m || "").split("-");
    return p.length === 2 ? "令和" + eraOf(p[0]) + "年" + Number(p[1]) + "月" : String(m || "");
  }
  function addMonths(m, n){
    var p = String(m).split("-");
    var t = (Number(p[0]) * 12 + Number(p[1]) - 1) + n;
    return Math.floor(t / 12) + "-" + String(t % 12 + 1).padStart(2, "0");
  }
  function dateLabel(d){
    var p = String(d || "").split("-");
    return p.length === 3 ? Number(p[1]) + "/" + Number(p[2]) : "";
  }
  function giftOf(e){
    if(e.category === "ortho") return "ホワイトニング";
    if(e.category === "general") return "物品 1,000円OFF";
    return e.giftLabel || "―";
  }
  function catLabel(c){
    return c === "ortho" ? "矯正中" : c === "general" ? "矯正以外" : "その他";
  }
  function toast(msg){
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  /* ---------- 保存（このページ自身に書き込む） ---------- */
  function lsGet(key){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(err){ return null; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(err){}
  }
  function ms(v){
    var t = Date.parse(v || "");
    return isNaN(t) ? 0 : t;
  }
  function setStatus(kind, label){
    $("#sync").setAttribute("data-state", kind);
    $("#syncLabel").textContent = label;
  }
  function normalize(raw){
    var s = { entries: [], deleted: [] };
    if(!raw || typeof raw !== "object") return s;
    if(Array.isArray(raw.entries)){
      raw.entries.forEach(function(e){ if(e && e.id) s.entries.push(e); });
    }
    if(Array.isArray(raw.deleted)){
      raw.deleted.forEach(function(d){ if(d && d.id) s.deleted.push({ id: String(d.id), at: Number(d.at) || 0 }); });
    }
    return s;
  }
  // ページに保存されている内容と、この端末に残っている控えを突き合わせる。
  // 新しいほうを残すので、別々の端末で入力しても消えない。
  function merge(a, b){
    a = normalize(a);
    b = normalize(b);
    var byId = {};
    a.entries.concat(b.entries).forEach(function(e){
      var prev = byId[e.id];
      if(!prev || ms(e.updatedAt) >= ms(prev.updatedAt)) byId[e.id] = e;
    });
    var tomb = {};
    a.deleted.concat(b.deleted).forEach(function(d){
      if(!tomb[d.id] || d.at > tomb[d.id].at) tomb[d.id] = d;
    });
    var kept = [];
    Object.keys(byId).forEach(function(id){
      // 削除のほうが新しければ、控えに残っていても復活させない
      if(tomb[id] && tomb[id].at >= ms(byId[id].updatedAt)) return;
      kept.push(byId[id]);
    });
    kept.sort(function(x, y){ return ms(x.createdAt) - ms(y.createdAt); });
    var cutoff = Date.now() - TOMBSTONE_MS;
    var living = [];
    Object.keys(tomb).forEach(function(id){ if(tomb[id].at >= cutoff) living.push(tomb[id]); });
    return { entries: kept, deleted: living };
  }
  function fingerprint(list){
    return list.map(function(e){ return e.id + ":" + (e.updatedAt || ""); }).sort().join("|");
  }
  function getApi(){
    if(apiPromise) return apiPromise;
    if(!window.claude || typeof window.claude.use !== "function"){
      apiPromise = Promise.resolve(null);
      return apiPromise;
    }
    apiPromise = window.claude.use("artifact").then(
      function(ns){ api = ns || null; return api; },
      function(){ return null; }
    );
    return apiPromise;
  }
  function stateJson(){
    return JSON.stringify({ updatedAt: Date.now(), entries: entries, deleted: deleted })
      .replace(/</g, "\\u003c");
  }
  function scheduleSave(){
    dirty = true;
    lsSet(LS_STATE, { updatedAt: Date.now(), entries: entries, deleted: deleted });
    if(!canSave){
      setStatus("local", readOnly ? "閲覧のみ" : "この端末のみ");
      return;
    }
    setStatus("saving", "保存中…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 1200);
  }
  function persist(){ scheduleSave(); }
  function removeStored(id){
    deleted.push({ id: id, at: Date.now() });
    scheduleSave();
  }
  // このページの元のソースを読み、データ部分だけ差し替えて新しい版として保存する
  function save(){
    if(saving || !dirty) return;
    getApi().then(function(ns){
      if(!ns){
        canSave = false;
        setStatus("local", "この端末のみ");
        renderNotice();
        return;
      }
      saving = true;
      dirty = false;
      var OPEN = "<" + 'script id="ledger-data" type="application/json">';
      var CLOSE = "<" + "/script>";
      fetch(location.pathname, { cache: "no-store" })
        .then(function(r){ return r.text(); })
        .then(function(src){
          var i = src.indexOf(OPEN);
          var j = i < 0 ? -1 : src.indexOf(CLOSE, i);
          if(i < 0 || j < 0) throw { code: "page_unreadable" };
          return ns.publish(src.slice(0, i + OPEN.length) + stateJson() + src.slice(j));
        })
        .then(function(){
          saving = false;
          setStatus("saved", "保存済み");
          renderNotice();
          if(dirty) scheduleSave();
        }, function(err){
          saving = false;
          dirty = true;
          onSaveError(err);
        });
    });
  }
  function onSaveError(err){
    var code = (err && err.code) || "error";
    if(code === "conflict"){
      // 他の人が先に保存した。各画面はその内容に更新される
      setStatus("saving", "更新中…");
      return;
    }
    if(code === "not_writer" || code === "not_granted" ||
       code === "consent_required" || code === "not_declared"){
      canSave = false;
      readOnly = true;
      setStatus("local", "閲覧のみ");
      render();
      return;
    }
    if(code === "rate_limited"){
      setStatus("saving", "保存中…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 5000);
      return;
    }
    setStatus("error", "保存できません");
    renderNotice();
  }

  /* ---------- 描画 ---------- */
  function monthsOf(){
    var set = {};
    entries.forEach(function(e){ if(e.month) set[e.month] = true; });
    set[view.month] = true;
    // R8.9から今月の2か月先まで。先の月にも登録できるようにしておく
    var last = addMonths(thisMonth(), 2);
    Object.keys(set).forEach(function(m){ if(m > last) last = m; });
    for(var m = START_MONTH; m <= last; m = addMonths(m, 1)) set[m] = true;
    return Object.keys(set).sort().reverse();
  }
  function fillMonthOptions(sel, selected){
    sel.innerHTML = monthsOf().map(function(m){
      return '<option value="' + esc(m) + '"' + (m === selected ? " selected" : "") + ">" +
        esc(monthLabel(m)) + "</option>";
    }).join("");
  }
  function renderMonths(){
    var ms = monthsOf();
    if(ms.indexOf(view.month) === -1) view.month = ms[0];
    fillMonthOptions(monthSel, view.month);
  }
  function monthEntries(){
    return entries.filter(function(e){ return e.month === view.month; })
      .sort(function(a,b){
        var ka = (a.postedAt || "9999") + (a.createdAt || "");
        var kb = (b.postedAt || "9999") + (b.createdAt || "");
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
  }
  function renderStats(){
    var list = monthEntries();
    var done = list.filter(function(e){ return e.status === "done"; }).length;
    var pending = list.length - done;
    var wh = list.filter(function(e){ return e.category === "ortho"; }).length;
    var goods = list.filter(function(e){ return e.category === "general"; }).length;
    statsEl.innerHTML =
      stat("口コミ件数", list.length, "件", "") +
      stat("プレゼント未渡し", pending, "件", "is-pending") +
      stat("渡し済", done, "件", "is-done") +
      stat("ホワイトニング／物品", wh + " / " + goods, "件", "");
  }
  function stat(label, value, unit, cls){
    return '<div class="stat ' + cls + '"><dt>' + esc(label) + "</dt><dd>" + esc(value) +
      "<small>" + esc(unit) + "</small></dd></div>";
  }
  function stampLabel(iso){
    var d = new Date(iso);
    if(!iso || isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "/" + d.getDate() + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function starStr(n){
    n = Number(n);
    if(!n) return "";
    return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
  }
  function cardHTML(e, i, isExample){
    var gift = giftOf(e);
    var giftCls = e.category === "ortho" ? "pill gift is-ortho" : "pill gift";
    var given = e.status === "done"
      ? (dateLabel(e.givenDate) ? dateLabel(e.givenDate) + " 渡し済" : "渡し済") + (e.staff ? " ／ " + e.staff : "")
      : "";
    return '<article class="card' + (isExample ? " example" : "") + '" data-status="' + esc(e.status || "pending") + '" data-id="' + esc(e.id) + '">' +
      '<div class="card-head">' +
        '<span class="idx">' + String(i + 1).padStart(2, "0") + "</span>" +
        (isExample ? '<span class="badge-example">記入例</span>' : "") +
        '<span class="pno">No.' + esc(e.patientNo || "―") + "</span>" +
        '<h3 class="pname">' + esc(e.name || "（氏名未入力）") +
          (e.reviewer ? "<span>Google表示名：" + esc(e.reviewer) + "</span>" : "") + "</h3>" +
        (starStr(e.stars) ? '<span class="stars" aria-label="評価' + esc(e.stars) + '">' + starStr(e.stars) + "</span>" : "") +
        '<span class="posted">' + esc(dateLabel(e.postedAt) || "") + "</span>" +
      "</div>" +
      (e.content ? '<blockquote class="quote">' + esc(e.content) + "</blockquote>" : "") +
      '<div class="card-foot">' +
        '<span class="pill cat-' + esc(e.category || "other") + '">' + esc(catLabel(e.category)) + "</span>" +
        '<span class="arrow">→</span>' +
        '<span class="' + giftCls + '">' + esc(gift) + "</span>" +
        '<button class="status-btn" data-act="toggle"' + (isExample ? " disabled" : "") + ">" +
          (e.status === "done" ? "☑ 渡し済" : "☐ 未渡し") + "</button>" +
        (given ? '<span class="given">' + esc(given) + "</span>" : "") +
        (!isExample && stampLabel(e.updatedAt)
          ? '<span class="updated" title="最後に更新した日時">更新 ' + esc(stampLabel(e.updatedAt)) + "</span>"
          : "") +
        (isExample ? "" : '<span class="row-actions">' +
          '<button class="icon-btn" data-act="edit">編集</button></span>') +
        (e.note ? '<p class="note"><b>備考</b>' + esc(e.note) + "</p>" : "") +
      "</div></article>";
  }
  function sampleEntries(){
    return [
      { id:"sample-1", month:view.month, postedAt:view.month + "-03", patientNo:"10428", name:"（例）佐藤 美咲",
        reviewer:"M.S", stars:5, content:"矯正の相談から丁寧に説明していただき、不安なく治療を進められています。スタッフの方の対応もいつも気持ちがいいです。",
        category:"ortho", status:"done", givenDate:view.month + "-12", staff:"中村", note:"" },
      { id:"sample-2", month:view.month, postedAt:view.month + "-11", patientNo:"09317", name:"（例）田中 健一",
        reviewer:"けん", stars:5, content:"クリーニングでお世話になりました。院内がとても清潔で、痛みもほとんどありませんでした。",
        category:"general", status:"pending", givenDate:"", staff:"", note:"次回来院時にお渡し" }
    ];
  }
  function renderNotice(){
    var el = $("#notice");
    if(canSave){
      el.hidden = true;
      return;
    }
    el.hidden = false;
    if(readOnly){
      el.className = "notice info";
      el.innerHTML = "<span>\ud83d\udc41\ufe0f</span><span><b>\u95b2\u89a7\u306e\u307f\u3067\u3059</b>" +
        "\u53f0\u5e33\u306e\u5185\u5bb9\u306f\u898b\u3089\u308c\u307e\u3059\u304c\u3001\u3053\u306e\u30a2\u30ab\u30a6\u30f3\u30c8\u306b\u306f\u7de8\u96c6\u306e\u6a29\u9650\u304c\u3042\u308a\u307e\u305b\u3093\u3002</span>";
    }else{
      el.className = "notice";
      el.innerHTML = "<span>\u26a0\ufe0f</span><span><b>\u3053\u306e\u753b\u9762\u3067\u306f\u4fdd\u5b58\u3067\u304d\u307e\u305b\u3093</b>" +
        "\u8868\u793a\u3055\u308c\u3066\u3044\u308b\u306e\u306f\u3001\u6700\u5f8c\u306b\u4fdd\u5b58\u3055\u308c\u305f\u53f0\u5e33\u306e\u5185\u5bb9\u3067\u3059\u3002" +
        "\u3053\u3053\u3067\u306e\u5909\u66f4\u306f\u3053\u306e\u7aef\u672b\u306b\u6b8b\u308a\u3001\u4fdd\u5b58\u3067\u304d\u308b\u72b6\u614b\u3067\u958b\u3044\u305f\u3068\u304d\u306b\u53cd\u6620\u3055\u308c\u307e\u3059\u3002</span>";
    }
  }
  function render(){
    document.body.classList.toggle("meeting", view.meeting);
    renderMonths();
    renderStats();
    renderNotice();
    var list = monthEntries();
    var filtered = list.filter(function(e){
      return view.filter === "all" ? true : (e.status || "pending") === view.filter;
    });
    if(list.length === 0){
      var elsewhere = entries.length;
      listEl.innerHTML = elsewhere > 0 ? "" : sampleEntries().map(function(e, i){ return cardHTML(e, i, true); }).join("");
      emptyEl.hidden = false;
      emptyEl.textContent = elsewhere > 0
        ? monthLabel(view.month) + "の口コミはありません。ほかの月に" + elsewhere + "件登録されています（左上の月の選択を切り替えてください）。"
        : monthLabel(view.month) + "の口コミはまだ登録されていません。上の「＋ 口コミを追加」から登録すると、この記入例は消えます。";
    }else if(filtered.length === 0){
      listEl.innerHTML = "";
      emptyEl.hidden = false;
      emptyEl.textContent = "この絞り込みに該当する口コミはありません。";
    }else{
      listEl.innerHTML = filtered.map(function(e, i){ return cardHTML(e, i, false); }).join("");
      emptyEl.hidden = true;
    }
  }

  /* ---------- 追加・編集 ---------- */
  function openForm(entry){
    editingId = entry ? entry.id : null;
    $("#dlgTitle").textContent = entry ? "口コミを編集" : "口コミを追加";
    $("#delBtn").hidden = !entry;
    var e = entry || { month: view.month, category: "ortho", status: "pending", stars: 5 };
    fillMonthOptions(form.month, e.month || view.month);
    form.postedAt.value = e.postedAt || "";
    form.patientNo.value = e.patientNo || "";
    form.name.value = e.name || "";
    form.reviewer.value = e.reviewer || "";
    form.stars.value = String(e.stars == null ? 5 : e.stars);
    form.content.value = e.content || "";
    form.category.value = e.category || "ortho";
    form.status.value = e.status || "pending";
    form.givenDate.value = e.givenDate || "";
    form.staff.value = e.staff || "";
    form.note.value = e.note || "";
    syncGiftField();
    dlg.showModal();
    setTimeout(function(){ form.patientNo.focus(); }, 30);
  }
  function syncGiftField(){
    var cat = form.category.value;
    var input = $("#giftInput");
    if(cat === "other"){
      input.readOnly = false;
      if(input.value === "ホワイトニング" || input.value === "物品 1,000円OFF") input.value = "";
      input.placeholder = "プレゼント内容を入力";
    }else{
      input.readOnly = true;
      input.placeholder = "";
      input.value = cat === "ortho" ? "ホワイトニング" : "物品 1,000円OFF";
    }
  }
  form.category.addEventListener("change", syncGiftField);
  form.status.addEventListener("change", function(){
    if(form.status.value === "done" && !form.givenDate.value) form.givenDate.value = today();
  });
  function commitEntry(keepOpen){
    var base = editingId ? entries.filter(function(x){ return x.id === editingId; })[0] : null;
    var entry = {
      id: base ? base.id : uid(),
      month: form.month.value || thisMonth(),
      postedAt: form.postedAt.value || "",
      patientNo: form.patientNo.value.trim(),
      name: form.name.value.trim(),
      reviewer: form.reviewer.value.trim(),
      stars: Number(form.stars.value),
      content: form.content.value.trim(),
      category: form.category.value,
      giftLabel: form.category.value === "other" ? $("#giftInput").value.trim() : "",
      status: form.status.value,
      givenDate: form.status.value === "done" ? (form.givenDate.value || today()) : "",
      staff: form.staff.value.trim(),
      note: form.note.value.trim(),
      createdAt: base ? (base.createdAt || new Date().toISOString()) : new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    if(base){
      entries = entries.map(function(x){ return x.id === entry.id ? entry : x; });
    }else{
      entries = entries.concat([entry]);
    }
    view.month = entry.month;
    persist(entry);
    render();
    if(!keepOpen){
      dlg.close();
      toast(base ? "更新しました" : "追加しました");
      return;
    }
    // 続けて次の口コミを入力できるように、内容だけ空にする
    editingId = null;
    $("#dlgTitle").textContent = "口コミを追加";
    $("#delBtn").hidden = true;
    ["postedAt", "patientNo", "name", "reviewer", "content", "givenDate", "staff", "note"]
      .forEach(function(k){ form[k].value = ""; });
    fillMonthOptions(form.month, entry.month);
    form.stars.value = "5";
    form.status.value = "pending";
    syncGiftField();
    form.patientNo.focus();
    toast("保存しました。続けて入力できます");
  }
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    commitEntry(false);
  });
  $("#saveAddBtn").addEventListener("click", function(){
    if(form.reportValidity()) commitEntry(true);
  });
  $("#saveAllBtn").addEventListener("click", function(){
    if(!canSave){
      toast(readOnly
        ? "この台帳を編集する権限がありません"
        : "この画面では保存できません。「バックアップ」から内容を控えてください");
      return;
    }
    dirty = true;
    clearTimeout(saveTimer);
    setStatus("saving", "保存中…");
    save();
  });
  $("#delBtn").addEventListener("click", function(){
    if(!editingId) return;
    var target = entries.filter(function(x){ return x.id === editingId; })[0];
    if(!target) return;
    if(!confirm("「" + (target.name || "この口コミ") + "」を削除します。よろしいですか？")) return;
    entries = entries.filter(function(x){ return x.id !== editingId; });
    removeStored(editingId);
    render();
    dlg.close();
    toast("削除しました");
  });
  $("#cancelBtn").addEventListener("click", function(){ dlg.close(); });
  $("#dlgClose").addEventListener("click", function(){ dlg.close(); });
  $("#addBtn").addEventListener("click", function(){ openForm(null); });

  listEl.addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-act]");
    if(!btn) return;
    var card = btn.closest(".card");
    if(!card || card.classList.contains("example")) return;
    var id = card.getAttribute("data-id");
    var entry = entries.filter(function(x){ return x.id === id; })[0];
    if(!entry) return;
    if(btn.getAttribute("data-act") === "edit"){
      openForm(entry);
    }else if(btn.getAttribute("data-act") === "toggle"){
      var next = Object.assign({}, entry, {
        status: entry.status === "done" ? "pending" : "done",
        updatedAt: new Date().toISOString()
      });
      next.givenDate = next.status === "done" ? (entry.givenDate || today()) : "";
      entries = entries.map(function(x){ return x.id === id ? next : x; });
      persist(next);
      render();
      toast(next.status === "done" ? "渡し済にしました" : "未渡しに戻しました");
    }
  });

  /* ---------- 表示切り替え ---------- */
  monthSel.addEventListener("change", function(){ view.month = monthSel.value; render(); });
  Array.prototype.forEach.call(document.querySelectorAll(".filters button"), function(b){
    b.addEventListener("click", function(){
      view.filter = b.getAttribute("data-filter");
      Array.prototype.forEach.call(document.querySelectorAll(".filters button"), function(x){
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
  });
  $("#meetingBtn").addEventListener("click", function(){
    view.meeting = !view.meeting;
    $("#meetingBtn").setAttribute("aria-pressed", String(view.meeting));
    render();
  });
  $("#printBtn").addEventListener("click", function(){ window.print(); });

  /* ---------- 共有用の書き出し ---------- */
  function plainText(){
    var list = monthEntries();
    var done = list.filter(function(e){ return e.status === "done"; }).length;
    var lines = ["【" + monthLabelLong(view.month) + " Google口コミ】 全" + list.length + "件（渡し済 " + done + "件／未渡し " + (list.length - done) + "件）", ""];
    list.forEach(function(e, i){
      lines.push((i + 1) + ". No." + (e.patientNo || "―") + " " + (e.name || "") + " 様" +
        (starStr(e.stars) ? " " + starStr(e.stars) : ""));
      lines.push("   " + catLabel(e.category) + " → " + giftOf(e) + "：" +
        (e.status === "done" ? "渡し済" + (dateLabel(e.givenDate) ? "（" + dateLabel(e.givenDate) + (e.staff ? " " + e.staff : "") + "）" : "") : "未渡し"));
      if(e.content) lines.push("   「" + e.content.replace(/\n/g, " ") + "」");
      if(e.note) lines.push("   備考：" + e.note);
      lines.push("");
    });
    return lines.join("\n");
  }
  $("#copyBtn").addEventListener("click", function(){
    var text = plainText();
    var ok = function(){ toast("コピーしました。LINEやチャットに貼り付けできます"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){ fallbackCopy(text, ok); });
    }else{
      fallbackCopy(text, ok);
    }
  });
  function fallbackCopy(text, ok){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var done = false;
    try{ done = document.execCommand("copy"); }catch(err){ done = false; }
    document.body.removeChild(ta);
    done ? ok() : toast("コピーできませんでした。画面から手入力でお願いします");
  }
  function csv(){
    var head = ["対象月","投稿日","患者番号","患者名","Google表示名","評価","区分","プレゼント","状態","渡した日","担当","口コミ内容","備考"];
    var rows = monthEntries().map(function(e){
      return [e.month, e.postedAt, e.patientNo, e.name, e.reviewer, e.stars || "",
        catLabel(e.category), giftOf(e), e.status === "done" ? "渡し済" : "未渡し",
        e.givenDate, e.staff, e.content, e.note];
    });
    return "﻿" + [head].concat(rows).map(function(r){
      return r.map(function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
  }
  $("#csvBtn").addEventListener("click", function(){
    if(!downloads) return;
    downloads.save({ filename: "reviews-" + view.month + ".csv", data: csv() }).then(function(){
      toast("書き出しました");
    }, function(err){
      if(err && err.code === "declined") return;
      toast("書き出せませんでした");
    });
  });

  /* ---------- バックアップと復元 ---------- */
  var bkDlg = $("#bkDlg");
  $("#backupBtn").addEventListener("click", function(){
    $("#bkText").value = JSON.stringify(entries, null, 1);
    bkDlg.showModal();
  });
  $("#bkClose").addEventListener("click", function(){ bkDlg.close(); });
  $("#bkCopy").addEventListener("click", function(){
    var ta = $("#bkText");
    ta.select();
    var ok = function(){ toast("コピーしました。メモ帳などに貼って保管してください"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(ok, function(){ fallbackCopy(ta.value, ok); });
    }else{
      fallbackCopy(ta.value, ok);
    }
  });
  $("#bkRestore").addEventListener("click", function(){
    var list;
    try{
      list = JSON.parse($("#bkText").value);
    }catch(err){
      toast("読み取れませんでした。バックアップの文字列をそのまま貼り付けてください");
      return;
    }
    if(!Array.isArray(list) || list.length === 0){
      toast("取り込める口コミが見つかりませんでした");
      return;
    }
    var byId = {};
    entries.forEach(function(e){ byId[e.id] = e; });
    var added = 0;
    list.forEach(function(e){
      if(!e || !e.id) return;
      if(!byId[e.id]) added++;
      byId[e.id] = e;
      persist(e);
    });
    entries = Object.keys(byId).map(function(k){ return byId[k]; });
    scheduleSave();
    render();
    bkDlg.close();
    toast(added > 0 ? added + "件を取り込みました" : "内容を更新しました");
  });

  // 保存できない画面で入力したまま閉じようとしたら引き止める
  window.addEventListener("beforeunload", function(ev){
    if(dirty && !canSave){
      ev.preventDefault();
      ev.returnValue = "";
    }
  });

  /* ---------- 起動 ---------- */
  var embedded = null;
  try{
    embedded = JSON.parse(document.getElementById("ledger-data").textContent);
  }catch(err){}
  var merged = merge(embedded, lsGet(LS_STATE));
  entries = merged.entries;
  deleted = merged.deleted;
  render();

  getApi().then(function(ns){
    if(!ns){
      canSave = false;
      setStatus("local", "この端末のみ");
    }else{
      setStatus("saved", "保存済み");
      // 端末に残っていた変更がページの内容と違えば、その場で保存して追いつかせる
      if(fingerprint(entries) !== fingerprint(normalize(embedded).entries)) scheduleSave();
    }
    renderNotice();
  });

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(d){
      if(!d) return;
      downloads = d;
      $("#csvBtn").hidden = false;
    }, function(){});
  }
})();
</script>
